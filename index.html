<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalasandhya 2026 — Program Coordination</title>

<!-- PWA: manifest + theme -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F4D2E">
<meta name="description" content="Cultural program coordination and running order for Kalasandhya 2026">

<!-- Icons -->
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- iOS: enables full-screen "app" behaviour when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalasandhya">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --maroon:#7A1F2B;
    --maroon-dark:#4A1019;
    --green:#1F4D2E;
    --green-dark:#123320;
    --green-light:#E8F0E5;
    --marigold:#E8943A;
    --marigold-dark:#A8631C;
    --gold:#C7972A;
    --ivory:#FBF4E6;
    --ivory-dark:#F2E6CC;
    --ink:#2B2420;
    --ink-soft:#6B5F52;
    --line:#E0D3B8;
    --white:#FFFFFF;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Tiro Devanagari Sanskrit', 'Cormorant Garamond', Georgia, serif;}

  /* ===== Pookalam header ===== */
  .pookalam-header{
    position:relative;
    background:var(--green);
    overflow:hidden;
    padding:0;
  }
  .pookalam-ring{
    width:100%;
    height:64px;
    display:block;
  }
  .header-content{
    padding:28px 32px 32px;
    text-align:center;
    position:relative;
  }
  .header-content .eyebrow{
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--marigold);
    font-weight:600;
    margin:0 0 6px;
  }
  .header-content h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--ivory);
    font-size:42px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .header-content .sub{
    color:#CFE0CC;
    font-size:15px;
    margin:0;
  }
  .pookalam-ring-bottom{
    width:100%;
    height:18px;
    display:block;
    transform:rotate(180deg);
  }

  /* ===== Tab nav ===== */
  .tabbar{
    display:flex;
    gap:4px;
    background:var(--white);
    border-bottom:2px solid var(--line);
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:50;
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:none;
    padding:16px 20px 14px;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tab-btn .count{
    background:var(--ivory-dark);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    padding:1px 7px;
    border-radius:10px;
  }
  .tab-btn.active{
    color:var(--maroon);
    border-bottom-color:var(--marigold);
  }
  .tab-btn.active .count{
    background:var(--marigold);
    color:var(--white);
  }
  .tab-btn:hover{color:var(--maroon);}

  .container{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .search-input{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
  }
  .search-input:focus{outline:none;border-color:var(--marigold);}
  select.filter-select{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .stat-pills{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .stat-pill{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-pill b{color:var(--ink);font-weight:700;}
  .stat-pill.warn{border-color:#E8C9A0;background:#FBF1E3;color:var(--marigold-dark);}
  .stat-pill.warn b{color:var(--marigold-dark);}
  .stat-pill.ok{border-color:#BFD8C2;background:#EEF6EE;color:var(--green);}
  .stat-pill.ok b{color:var(--green);}

  /* ===== Category breakdown cards ===== */
  .category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .category-card{
    border-radius:var(--radius-lg);
    padding:16px 14px;
    text-align:center;
    border:1px solid transparent;
  }
  .cc-icon{width:26px;height:26px;margin-bottom:8px;}
  .cc-count{font-family:'Cormorant Garamond', Georgia, serif;font-size:28px;font-weight:700;line-height:1;}
  .cc-label{font-size:12.5px;font-weight:600;margin-top:4px;opacity:0.85;}
  .cc-coral{background:#FAECE7;color:#8A3B1E;border-color:#F0997B;}
  .cc-teal{background:#E1F5EE;color:#0F6E56;border-color:#5DCAA5;}
  .cc-amber{background:#FAEEDA;color:#854F0B;border-color:#EF9F27;}
  .cc-purple{background:#EEEDFE;color:#3C3489;border-color:#7F77DD;}
  .cc-gray{background:#F1EFE8;color:#444441;border-color:#B4B2A9;}

  /* ===== Sponsor tiers ===== */
  .tier-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .sponsor-total-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--green-light);
    border:1.5px solid var(--green);
    border-radius:var(--radius-lg);
    padding:16px 20px;
    margin-bottom:16px;
  }
  .sponsor-total-banner .stb-label{
    font-size:13px;
    font-weight:700;
    color:var(--green-dark);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .sponsor-total-banner .stb-amount{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:32px;
    font-weight:700;
    color:var(--green-dark);
  }
  .tier-card{
    border-radius:var(--radius-lg);
    padding:16px 14px;
    text-align:center;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .tier-card:hover{transform:translateY(-2px);}
  .tier-card.active{box-shadow:0 0 0 2px currentColor inset;}
  .tier-icon{width:26px;height:26px;margin-bottom:8px;}
  .tier-count{font-family:'Cormorant Garamond', Georgia, serif;font-size:28px;font-weight:700;line-height:1;}
  .tier-label{font-size:12.5px;font-weight:700;margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;}
  .tier-platinum{background:#EEF1F4;color:#3D4A57;border-color:#A9B7C4;}
  .tier-gold{background:#FBF1D7;color:#8A6310;border-color:var(--gold);}
  .tier-silver{background:#F1F2F3;color:#5B5F63;border-color:#B7BABD;}
  .tier-bronze{background:#F5E6D8;color:#8A4F1E;border-color:#C98549;}

  .sponsor-form{
    display:grid;
    grid-template-columns:1.3fr 1fr 0.9fr auto;
    gap:8px;
    margin-bottom:16px;
  }
  .sponsor-form-extended{
    grid-template-columns:1.2fr 1fr 0.9fr 0.8fr 0.8fr auto;
  }
  .sponsor-form input, .sponsor-form select{
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .sponsor-form button{
    border:none;
    background:var(--marigold);
    color:var(--white);
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .sponsor-form button:hover{background:var(--marigold-dark);}

  .sponsor-section{margin-bottom:22px;}
  .sponsor-section-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .sponsor-section-header .tier-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .tier-dot.tier-platinum{background:#A9B7C4;}
  .tier-dot.tier-gold{background:var(--gold);}
  .tier-dot.tier-silver{background:#B7BABD;}
  .tier-dot.tier-bronze{background:#C98549;}
  .sponsor-section-header h4{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:18px;
    margin:0;
    color:var(--ink);
  }
  .sponsor-section-header .tier-tag-count{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--ivory-dark);
    padding:1px 9px;
    border-radius:999px;
  }
  .sponsor-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sponsor-row{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .sponsor-row .sname{font-size:14px;font-weight:700;color:var(--ink);}
  .sponsor-row .scontact{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sponsor-row .sinfo{flex:1;min-width:0;}
  .sponsor-row select.tier-select{
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:5px 8px;
    font-size:12.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .sfield{
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid transparent;
    min-width:70px;
    text-align:center;
  }
  .sfield:hover{background:var(--ivory);border-color:var(--line);}
  .sfield-amount{font-weight:700;color:var(--green-dark);}
  .sfield-empty{color:var(--ink-soft);font-style:italic;font-weight:400;}
  .sfield-input{
    border:1.5px solid var(--marigold);
    border-radius:6px;
    padding:3px 7px;
    font-size:13px;
    font-family:inherit;
    width:90px;
    background:var(--white);
    color:var(--ink);
    outline:none;
    text-align:center;
  }
  .sponsor-row button.rm-btn{
    border:none;
    background:none;
    color:var(--maroon);
    font-size:18px;
    cursor:pointer;
    width:24px;height:24px;
    flex-shrink:0;
  }

  /* ===== Participants tab ===== */
  .participant-picker{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .participant-picker select{
    flex:1;
    min-width:240px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .participant-picker select:focus{outline:none;border-color:var(--marigold);}
  .participant-panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 20px;
  }
  .participant-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:4px;
  }
  .participant-panel-header h3{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:21px;
    color:var(--maroon);
    margin:0;
  }
  .participant-panel-header .pcount{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--ivory-dark);
    padding:2px 10px;
    border-radius:999px;
  }
  .participant-original-note{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--ivory);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:9px 12px;
    margin:10px 0 16px;
  }
  .participant-original-note button{
    border:none;
    background:none;
    color:var(--maroon);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    font-family:inherit;
    padding:0;
    margin-left:6px;
  }
  .participant-add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .participant-add-row input{
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .participant-add-row input.pname-input{flex:1.6;}
  .participant-add-row input.pmember-input{flex:1;}
  .participant-add-row button{
    border:none;
    background:var(--marigold);
    color:var(--white);
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .participant-add-row button:hover{background:var(--marigold-dark);}
  .participant-list{
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .participant-row{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 13px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .participant-row .pnum{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:700;
    color:var(--gold);
    font-size:15px;
    min-width:20px;
  }
  .participant-row .pinfo{flex:1;min-width:0;}
  .pinfo-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:14px;
    align-items:center;
  }
  .pfield{
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid transparent;
    display:inline-block;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pfield:hover{background:var(--white);border-color:var(--line);}
  .pfield:nth-child(1){font-weight:700;}
  .pfield-member{font-size:12.5px;color:var(--ink-soft);}
  .pfield-empty{color:var(--ink-soft);font-style:italic;font-weight:400;}
  .pfield-input{
    border:1.5px solid var(--marigold);
    border-radius:6px;
    padding:3px 7px;
    font-size:13.5px;
    font-family:inherit;
    width:100%;
    background:var(--white);
    color:var(--ink);
    outline:none;
  }
  .participant-row button.rm-btn{
    border:none;
    background:none;
    color:var(--maroon);
    cursor:pointer;
    width:22px;height:22px;
    flex-shrink:0;
  }
  .participant-empty-row{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:24px 10px;
    border:1.5px dashed var(--line);
    border-radius:9px;
  }
  .no-program-selected{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }

  /* ===== Program cards / table ===== */
  .program-table{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .program-table thead th{
    background:var(--green);
    color:var(--ivory);
    text-align:left;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    padding:12px 14px;
    position:sticky;
    top:0;
  }
  .program-table tbody tr{
    border-bottom:1px solid var(--ivory-dark);
  }
  .program-table tbody tr:last-child{border-bottom:none;}
  .program-table tbody tr:hover{background:#FBF8F1;}
  .program-table td{
    padding:12px 14px;
    font-size:13.5px;
    vertical-align:top;
  }
  .pname{font-weight:700;color:var(--ink);font-size:14px;}
  .pname.pending{color:var(--ink-soft);font-style:italic;font-weight:600;}
  .psub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
  .cat-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .cat-Group-Dance{background:#F4E3DD;color:#8A3B1E;}
  .cat-Group-Song{background:#E1ECE0;color:#2C5836;}
  .cat-Thiruvathirakali{background:#F6E6C8;color:#8A6310;}
  .cat-Other{background:#E7E2EE;color:#4A3D77;}

  select.category-select{
    font-size:11.5px;
    font-weight:700;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    max-width:140px;
  }
  select.cat-select-Group-Dance{background:#F4E3DD;color:#8A3B1E;}
  select.cat-select-Group-Song{background:#E1ECE0;color:#2C5836;}
  select.cat-select-Thiruvathirakali{background:#F6E6C8;color:#8A6310;}
  select.cat-select-Other{background:#E7E2EE;color:#4A3D77;}
  select.cat-select-Admin-item{background:#F1EFE8;color:#444441;}

  select.coord-select, input.timing-input{
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    width:100%;
    background:var(--white);
    color:var(--ink);
  }
  select.coord-select:focus, input.timing-input:focus{outline:none;border-color:var(--marigold);}
  input.timing-input{max-width:90px;}

  .yn-toggle{
    display:inline-flex;
    border:1.5px solid var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .yn-toggle button{
    border:none;
    background:var(--white);
    padding:5px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink-soft);
  }
  .yn-toggle button.yes.active{background:var(--green);color:var(--white);}
  .yn-toggle button.no.active{background:var(--maroon);color:var(--white);}
  .yn-toggle-locked{opacity:0.55;}
  .yn-toggle-locked button{cursor:not-allowed;}

  .withdraw-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    width:26px;height:26px;
    flex-shrink:0;
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .withdraw-btn:hover{color:var(--maroon);background:var(--green-light);}
  .withdraw-btn .ico{width:16px;height:16px;}

  .restore-btn{
    border:1.5px solid var(--green);
    background:var(--white);
    color:var(--green);
    padding:6px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .restore-btn:hover{background:var(--green);color:var(--white);}
  .restore-btn .ico{width:14px;height:14px;}

  /* ===== Sequence builder tab ===== */
  .seq-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
  @media (max-width:900px){.seq-layout{grid-template-columns:1fr;}}
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 18px 20px;
  }
  .panel h3{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:20px;
    color:var(--maroon);
    margin:0 0 4px;
  }
  .panel .panel-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .pool-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:560px;
    overflow-y:auto;
    padding-right:4px;
  }
  .pool-item{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;

  /* ===================== MOBILE LAYOUT ===================== */
  @media (max-width: 640px){

      grid-template-columns:1fr;

    .sponsor-form button{width:100%;}

    /* Participant add row: stack to one column */

      flex-direction:column;
    }
    .participant-add-row button{width:100%;}

    /* Toolbar (search + filters): stack */
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar .search-input, .toolbar select{width:100%;}

    /* ===== Responsive table -> card transform ===== */

    .program-table thead{display:none;}
    .program-table, .program-table tbody, .program-table tr, .program-table td{
      display:block;
      width:100% !important;
    }
    .program-table{border:none;background:none;}
    .program-table tr{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      margin-bottom:10px;
      padding:10px 12px;
    }
    .program-table td{
      border-bottom:none;
      padding:7px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .program-table td::before{
      content:attr(data-label);
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.03em;
      color:var(--ink-soft);

      min-width:80px;

    .program-table td > *{flex:1;text-align:right;}
    .program-table td .yn-toggle{justify-content:flex-end;}
    .program-table td select{max-width:170px;}
    .program-table td .psub{text-align:right;}

    /* Sequence builder: stack pool/running-order panels */
    .seq-layout{grid-template-columns:1fr;}

    /* Final tab action buttons: full-width stack */
    .actions-bar{flex-direction:column;}
    .actions-bar button{width:100%;justify-content:center;display:flex;}

    /* Final running order rows: wrap timing/status onto their own line */
    .final-row{flex-wrap:wrap;}
    .final-row .finfo{flex:1 1 100%;order:1;}
    .final-row .fnum{order:0;}
    .final-row .ftiming{order:2;min-width:0;margin-left:50px;text-align:left;}
    .final-row .fstatus{order:3;min-width:0;text-align:left;}

    /* Pinned diagnostic / sync banners: don't eat the whole screen */
    .fb-status-banner{font-size:12px;padding:10px 14px;}
    .install-banner{font-size:12px;padding:10px 14px;}
    .install-banner span{flex:1 1 100%;order:1;}
    .install-banner button#installBtn{order:2;}
    .install-banner button#dismissInstallBtn{order:3;}
    .fb-status-banner .fb-detail{font-size:10.5px;word-break:break-all;}

    /* Sponsor row fields wrap instead of overflowing */
    .sponsor-row{flex-wrap:wrap;}
    .sponsor-row .sinfo{flex:1 1 100%;order:1;}
    .sfield{order:2;}
    .sponsor-row select.tier-select{order:3;margin-top:6px;}
    .sponsor-row button.rm-btn{order:4;margin-top:6px;}
  }
</style>

<script type="module">
// ===================== FIREBASE SETUP =====================
// 1. Go to https://console.firebase.google.com, create a free project.
// 2. Add a Web App (</> icon) inside the project, copy the config object it gives you.
// 3. Paste it below, replacing the placeholder values.
// 4. In the Firebase console, go to Build > Firestore Database > Create database
//    (start in test mode for now, or use the rules suggested further down in this file).
//
// Suggested Firestore rules (Build > Firestore Database > Rules) once you're ready
// to move off test mode — this keeps the database readable/writable only by anyone
// with the link, which is fine for an internal committee tool with no sign-in:
//
//   rules_version = '2';
//   service cloud.firestore {
//     match /databases/{database}/documents {
//       match /kalasandhya/{document} {
//         allow read, write: if true;
//       }
//     }
//   }
//
// Test mode rules expire after 30 days, so swap to the above (or tighter rules
// with Firebase Auth) before then or the app will lose write access silently.
const firebaseConfig = {
  apiKey: "AIzaSyAKqBGgrWHRAmYOxXALKyDIULkPnZ1oyig",
  authDomain: "kalasandhya.firebaseapp.com",
  projectId: "kalasandhya",
  storageBucket: "kalasandhya.firebasestorage.app",
  messagingSenderId: "475383098157",
  appId: "1:475383098157:web:f5de02f34fcf0d9fd301a4"
};

let db = null;
let setDoc = null;
let onSnapshot = null;
let doc = null;
let firebaseReady = false;
let firebaseError = null;

let DOC_PROGRAMS = null;
let DOC_SEQUENCE = null;
let DOC_SPONSORS = null;
let DOC_PARTICIPANTS = null;

async function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") return;
  try{
    const timeout = new Promise((_, reject)=>setTimeout(()=>reject(new Error('Firebase load timed out')), 6000));
    const loadModules = Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
    ]);
    const [{ initializeApp }, firestoreMod] = await Promise.race([loadModules, timeout]);
    doc = firestoreMod.doc;
    setDoc = firestoreMod.setDoc;
    onSnapshot = firestoreMod.onSnapshot;
    const app = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(app);
    DOC_PROGRAMS = doc(db, 'kalasandhya', 'programs');
    DOC_SEQUENCE = doc(db, 'kalasandhya', 'sequence');
    DOC_SPONSORS = doc(db, 'kalasandhya', 'sponsors');
    DOC_PARTICIPANTS = doc(db, 'kalasandhya', 'participants');
    firebaseReady = true;
  }catch(e){
    console.error('Firebase failed to load, falling back to local storage', e);
    firebaseReady = false;
    firebaseError = e.message || String(e);
  }
}

function renderFirebaseStatusBanner(){
  const el = document.getElementById('firebaseStatusBanner');
  if(!el) return;
  // Only show the banner if the person has actually tried to configure Firebase
  // (left as placeholder = intentionally running local-only, not an error).
  const attemptedFirebase = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
  if(!attemptedFirebase || !firebaseError){
    el.style.display = 'none';
    el.innerHTML = '';
    repositionInstallBanner();
    return;
  }
  el.className = 'fb-status-banner';
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="fb-msg">⚠ Live sync isn't connecting — running on this browser's local storage instead.</span>
    <span class="fb-detail">${escapeHtml(firebaseError)}</span>
    <button id="dismissFbBanner">Dismiss</button>
  `;
  document.getElementById('dismissFbBanner').addEventListener('click', ()=>{
    el.style.display = 'none';
    repositionInstallBanner();
  });
  repositionInstallBanner();

// Data layer: Firebase Firestore when configured (live multi-device sync),
// falling back to browser localStorage (this device/browser only) if the
// firebaseConfig above still has placeholder values.
let unsubPrograms = null;
let unsubSequence = null;
let unsubSponsors = null;
let unsubParticipants = null;
let suppressNextProgramsSnapshot = false;
let suppressNextSequenceSnapshot = false;

// Backfills any fields that didn't exist yet when older data was cached
// (e.g. earlier sessions before submitterEmail/submitterPhone existed),
// so a schema change here never breaks a returning visitor's saved data.
function migratePrograms(cached){
  const fresh = buildPrograms();
  const freshById = new Map(fresh.map(p=>[p.id, p]));
  let changed = false;
  const merged = cached.map(p=>{
    const defaults = freshById.get(p.id);
    if(!defaults) return p;
    const filled = { ...defaults, ...p };
    if(JSON.stringify(filled) !== JSON.stringify(p)) changed = true;
    return filled;
  });
  return { merged, changed };
}

// Upgrades the old admin-item shape ({type:'admin', label}, no programId) into
// the current shape, where every admin item is backed by a real record in
// state.programs (so Tab 1 editing and the running order share one source of truth).
// Mutates state.programs in place when it needs to create backing records.
// Returns { sequence, programsChanged }.
function migrateSequence(sequence){
  if(!Array.isArray(sequence)) return { sequence: [], programsChanged: false };
  let programsChanged = false;
  const migrated = sequence.map(item=>{
    if(item.type === 'admin' && !item.programId){
      const presetDuration = (item.label in ADMIN_PRESET_DURATIONS_SECONDS) ? ADMIN_PRESET_DURATIONS_SECONDS[item.label] : null;
      const adminProgram = createAdminProgramRecord(item.label || 'Admin item', presetDuration);
      state.programs.push(adminProgram);
      programsChanged = true;
      return { id: item.id, type: 'admin', programId: adminProgram.id };
    }
    return item;
  });
  return { sequence: migrated, programsChanged };
}

function loadStateLocal(){
  let programs = null, sequence = null, sponsors = null, participants = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY_PROGRAMS);
    if(raw) programs = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_SEQUENCE);
    if(raw) sequence = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_SPONSORS);
    if(raw) sponsors = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_PARTICIPANTS);
    if(raw) participants = JSON.parse(raw);
  }catch(e){}

  if(!programs){
    programs = buildPrograms();
    saveProgramsRemote(programs);
  } else {
    const { merged, changed } = migratePrograms(programs);
    programs = merged;
    if(changed) saveProgramsRemote(programs);
  }
  state.programs = programs;
  const seqMigration = migrateSequence(sequence || []);
  state.sequence = seqMigration.sequence;
  if(seqMigration.programsChanged){
    saveProgramsRemote(state.programs);
    saveSequenceRemote();
  }
  state.sponsors = sponsors || [];
  state.participants = participants || {};
  state.loaded = true;
}

function loadStateFirebase(){
  return new Promise((resolve)=>{
    let progLoaded = false;
    let seqLoaded = false;
    let sponsorsLoaded = false;
    let participantsLoaded = false;
    let resolved = false;
    function maybeResolve(){
      if(progLoaded && seqLoaded && sponsorsLoaded && participantsLoaded && !resolved){
        resolved = true;
        state.loaded = true;
        resolve();
      }
    }

    unsubPrograms = onSnapshot(DOC_PROGRAMS, (snap)=>{
      if(suppressNextProgramsSnapshot){ suppressNextProgramsSnapshot = false; }
      else if(snap.exists() && snap.data().items){
        const { merged, changed } = migratePrograms(snap.data().items);
        state.programs = merged;
        if(changed) saveProgramsRemote(merged);
      } else if(!progLoaded){
        const fresh = buildPrograms();
        state.programs = fresh;
        setDoc(DOC_PROGRAMS, { items: fresh });
      }
      progLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore programs sync error', err);
      firebaseError = err.message || String(err);
      showToast('Could not connect to live sync — check Firebase setup');
      progLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubSequence = onSnapshot(DOC_SEQUENCE, (snap)=>{
      if(suppressNextSequenceSnapshot){
        suppressNextSequenceSnapshot = false;
        seqLoaded = true;
        maybeResolve();
        refreshActiveTab();
        return;
      }

      const rawSequence = (snap.exists() && snap.data().items) ? snap.data().items : [];
      const applyMigration = ()=>{
        const seqMigration = migrateSequence(rawSequence);
        state.sequence = seqMigration.sequence;
        if(seqMigration.programsChanged){
          saveProgramsRemote(state.programs);
          saveSequenceRemote();
        }
        seqLoaded = true;
        maybeResolve();
        refreshActiveTab();
      };

      if(progLoaded){
        applyMigration();
      } else {
        // Programs haven't loaded yet — wait for them so migration has
        // the real program list to append backing records to.
        const waitForPrograms = setInterval(()=>{
          if(progLoaded){
            clearInterval(waitForPrograms);
            applyMigration();
          }
        }, 100);
      }
    }, (err)=>{
      console.error('Firestore sequence sync error', err);
      firebaseError = err.message || String(err);
      seqLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubSponsors = onSnapshot(DOC_SPONSORS, (snap)=>{
      if(suppressNextSponsorsSnapshot){ suppressNextSponsorsSnapshot = false; }
      else {
        state.sponsors = (snap.exists() && snap.data().items) ? snap.data().items : [];
      }
      sponsorsLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore sponsors sync error', err);
      firebaseError = err.message || String(err);
      sponsorsLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubParticipants = onSnapshot(DOC_PARTICIPANTS, (snap)=>{
      if(suppressNextParticipantsSnapshot){ suppressNextParticipantsSnapshot = false; }
      else {
        state.participants = (snap.exists() && snap.data().items) ? snap.data().items : {};
      }
      participantsLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore participants sync error', err);
      firebaseError = err.message || String(err);
      participantsLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    setTimeout(()=>{ if(!resolved){ resolved = true; state.loaded = true; resolve(); } }, 4000);
  });
}

function renderPookalamRing(){
  const svg = document.getElementById('ringTop');
  const colors = ['#E8943A','#7A1F2B','#C7972A','#FBF4E6','#E8943A','#C7972A'];
  let html = '';
  const w = 1200, h = 64;
  const cy = 0;
  for(let ring=0; ring<3; ring++){
    const r = 30 + ring*14;
    const color = colors[ring % colors.length];
    const n = 26 - ring*4;
    for(let i=0;i<n;i++){
      const angle = (i/n) * Math.PI;
      const spacing = w / n;
      const x = i*spacing + spacing/2;
      const yOffset = Math.sin(angle*0)*0;
      html += `<circle cx="${x}" cy="${10+ring*16}" r="${5-ring}" fill="${color}" opacity="${0.85 - ring*0.15}"/>`;
    }
  }
  // simple repeating petal motif instead (cleaner)
  html = '';
  const petalColors = ['#E8943A','#FBF4E6','#7A1F2B','#C7972A'];
  const spacing = 46;
  const count = Math.ceil(w/spacing)+1;
  for(let i=0;i<count;i++){
    const x = i*spacing;
    const c1 = petalColors[i%4];
    html += `<circle cx="${x}" cy="14" r="6" fill="${c1}" opacity="0.9"/>`;
    html += `<circle cx="${x+spacing/2}" cy="34" r="9" fill="${petalColors[(i+1)%4]}" opacity="0.85"/>`;
    html += `<circle cx="${x}" cy="52" r="4" fill="${petalColors[(i+2)%4]}" opacity="0.7"/>`;
  }
  svg.innerHTML = html;
}

function getDedupedContacts(){
  const map = new Map();
  state.programs.forEach(p=>{
    if(p.isAdminItem) return;
    const submitterEmail = p.submitterEmail || '';
    const submitterPhone = p.submitterPhone || '';
    const emailKey = submitterEmail.trim().toLowerCase();
    const nameKey = (p.submitter || '').trim().toLowerCase();
    const key = emailKey || nameKey;
    if(!key) return;
    if(!map.has(key)){
      map.set(key, {
        name: (p.submitter || '').trim(),
        email: submitterEmail.trim(),
        phone: submitterPhone.trim(),
        programs: []
      });
    }
    map.get(key).programs.push(p.programName);
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function updateCounts(){
  const active = state.programs.filter(p=>!p.withdrawn);
  const confirmed = active.filter(p=>p.groupConfirmed==='Y').length;
  const needed = active.length - confirmed;
  document.getElementById('countProgramsConfirmed').textContent = confirmed;
  document.getElementById('countProgramsNeeded').textContent = needed;
  document.getElementById('countContacts').textContent = getDedupedContacts().length;
  document.getElementById('countParticipants').textContent = Object.values(state.participants).reduce((sum, list) => sum + list.length, 0);
  document.getElementById('countSponsors').textContent = state.sponsors.length;
  const deletedCountEl = document.getElementById('countDeleted');
  if(deletedCountEl) deletedCountEl.textContent = getWithdrawnPrograms().length;
  document.getElementById('countFinal').textContent = state.sequence.length;
}

function buildCategoryGrid(programs){
  const counts = {};
  programs.forEach(p=>{ counts[p.category] = (counts[p.category]||0) + 1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>{
    const meta = categoryMeta[cat] || defaultCategoryMeta;
    return `
      <div class="category-card cc-${meta.color}">
        <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${meta.icon}</svg>
        <div class="cc-count">${count}</div>
        <div class="cc-label">${escapeHtml(cat)}</div>
      </div>
    `;
  }).join('');
}

function programsForGroupValue(groupValue){
  return groupValue === 'Y'
    ? state.programs.filter(p=>p.groupConfirmed === 'Y' && !p.withdrawn)
    : state.programs.filter(p=>p.groupConfirmed !== 'Y' && !p.withdrawn);
}

function getWithdrawnPrograms(){
  return state.programs.filter(p=>p.withdrawn)
    .slice()
    .sort((a,b)=>(b.withdrawnAt||0) - (a.withdrawnAt||0));
}

function withdrawProgram(id){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const label = p.programName || p.submitter || 'this entry';
  const inSequence = state.sequence.some(s=>s.programId===id);
  const confirmMsg = inSequence
    ? `Move "${label}" to Deleted programs? It will also be removed from the sequence builder / running order, and everything after it will shift up one slot. You can restore the program later, but you'll need to re-add it to the sequence yourself.`
    : `Move "${label}" to Deleted programs? You can restore it later from that tab.`;
  if(!confirm(confirmMsg)) return;
  p.withdrawn = true;
  p.withdrawnAt = Date.now();
  saveProgramsRemote(state.programs);
  if(inSequence){
    state.sequence = state.sequence.filter(s=>s.programId!==id);
    saveSequenceRemote();
  }
  updateCounts();
  renderBothProgramsTabsIfVisible();
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab === 'deleted') renderDeletedTab();
  if(activeTab === 'sequence') renderSequenceTab();
  if(activeTab === 'final') renderFinalTab();
  showToast(inSequence ? `Moved "${label}" to Deleted programs and removed it from the running order` : `Moved "${label}" to Deleted programs`);
}

function restoreProgram(id){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  p.withdrawn = false;
  p.withdrawnAt = null;
  saveProgramsRemote(state.programs);
  updateCounts();
  renderDeletedTab();
  showToast(`Restored "${p.programName || p.submitter}"`);
}

function formatWithdrawnDate(ts){

  return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) +

}

function renderProgramRowsInto(tbodyId, emptyStateId, filters, groupValue){
  const tbody = document.getElementById(tbodyId);
  if(!tbody) return;
  const q = filters.search.toLowerCase();
  const scoped = programsForGroupValue(groupValue);
  const filtered = scoped.filter(p=>{
    if(filters.category && p.category !== filters.category) return false;
    if(filters.status === 'Y' && p.inputsReceived !== 'Y') return false;
    if(filters.status === 'N' && p.inputsReceived !== 'N') return false;
    if(filters.status === 'pending-name' && !p.isPending) return false;
    if(q && groupValue !== 'N' && !(p.programName.toLowerCase().includes(q) || p.submitter.toLowerCase().includes(q))) return false;
    if(q && groupValue === 'N' && !p.submitter.toLowerCase().includes(q)) return false;
    return true;
  });

  if(emptyEl) emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';

  tbody.innerHTML = filtered.map(p=>{

function activateRunTimeEdit(span){
  if(span.querySelector('input')) return; // already editing
  const id = span.dataset.id;
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const currentValue = p.runTimeSeconds!=null ? formatRunTime(p.runTimeSeconds) : '';

  span.classList.remove('pfield-empty');
  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = 'mm:ss';
  input.className = 'pfield-input';
  input.style.maxWidth = '70px';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      p.runTimeSeconds = null;
    } else {
      const parsed = parseRunTime(raw);
      if(parsed == null){
        showToast('Enter run time as mm:ss, e.g. 6:30');
        renderBothProgramsTabsIfVisible();
        return;
      }
      p.runTimeSeconds = parsed;
    }
    saveProgramsDebounced();
    renderBothProgramsTabsIfVisible();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderBothProgramsTabsIfVisible();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

function renderBothProgramsTabsIfVisible(){
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab === 'programs-confirmed') renderProgramsConfirmedTab();
  if(activeTab === 'programs-needed') renderProgramsNeededTab();
  updateCounts();
}

function onFieldChange(e){
  const id = e.target.dataset.id;
  const field = e.target.dataset.field;
  const value = e.target.value;
  updateProgram(id, field, value);
}

function updateProgram(id, field, value){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  p[field] = value;
  saveProgramsDebounced();
}

function truncate(s, n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===================== RUN TIME / RUN SHEET HELPERS =====================
const DEFAULT_RUN_TIME_SECONDS = 5 * 60;
const BUFFER_SECONDS = 90; // 1.5 min buffer between every item
const SHOW_START_TIME = { hour: 16, minute: 0 }; // 4:00pm

// Parses "6:30" -> 390 seconds. Accepts bare numbers ("6" -> 360s) too.
// Returns null for empty/unparseable input.
function parseRunTime(str){
  if(str == null) return null;
  const s = String(str).trim();
  if(!s) return null;
  const mmss = s.match(/^(\d+):([0-5]?\d)$/);
  if(mmss) return (parseInt(mmss[1],10) * 60) + parseInt(mmss[2],10);
  const minsOnly = s.match(/^\d+$/);
  if(minsOnly) return parseInt(s,10) * 60;
  return null;
}

function formatRunTime(totalSeconds){
  if(totalSeconds == null) return '';
  const m = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function getProgramRunTimeSeconds(p){
  return (p.runTimeSeconds != null) ? p.runTimeSeconds : DEFAULT_RUN_TIME_SECONDS;
}

function formatClockTime(date){
  return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

// Walks the sequence in order starting from SHOW_START_TIME, returning
// { startTime, endTime, durationSeconds, isDefaultDuration } per item,
// with a 1.5-minute buffer inserted between every item (including before the first).
// Both regular programs and admin items are real records in state.programs,
// so duration always comes from the same single source: p.runTimeSeconds.
function computeRunSheetTimes(){
  const base = new Date();
  base.setHours(SHOW_START_TIME.hour, SHOW_START_TIME.minute, 0, 0);
  let cursor = new Date(base);

  return state.sequence.map(item=>{
    const p = state.programs.find(pr=>pr.id===item.programId);
    const durationSeconds = p ? getProgramRunTimeSeconds(p) : DEFAULT_RUN_TIME_SECONDS;
    const isDefaultDuration = !(p && p.runTimeSeconds != null);
    const startTime = new Date(cursor);
    const endTime = new Date(startTime.getTime() + durationSeconds*1000);
    cursor = new Date(endTime.getTime() + BUFFER_SECONDS*1000);
    return { itemId: item.id, startTime, endTime, durationSeconds, isDefaultDuration };
  });
}

function renderContactsRows(){
  const tbody = document.getElementById('contactsTbody');
  if(!tbody) return;
  const q = contactsSearch.toLowerCase();
  const contacts = getDedupedContacts()
    .filter(c=>{
      if(!q) return true;
      return c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.phone.toLowerCase().includes(q);
    })
    .sort((a,b)=> contactsSort === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));

  document.getElementById('contactsEmptyState').style.display = contacts.length === 0 ? 'block' : 'none';

  tbody.innerHTML = contacts.map(c=>`
    <tr>
      <td data-label="Name"><div class="pname">${escapeHtml(c.name)}</div></td>
      <td data-label="Email">${c.email ? `<a href="mailto:${escapeHtml(c.email)}" style="color:var(--maroon);text-decoration:none;font-size:13px;">${escapeHtml(c.email)}</a>` : '<span class="psub">—</span>'}</td>
      <td data-label="Phone" style="font-size:13px;">${c.phone ? escapeHtml(c.phone) : '<span class="psub">—</span>'}</td>
    </tr>
  `).join('');
}

function exportContactsCsv(){
  const contacts = [...getDedupedContacts()].sort((a,b)=> contactsSort === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  const rows = [['Name','Email','Phone']];
  contacts.forEach(c=>rows.push([c.name, c.email, c.phone]));
  const csv = rows.map(r=>r.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kalasandhya-contacts-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Contacts exported');
}

function addParticipant(){
  const nameInput = document.getElementById('participantNameInput');
  const memberInput = document.getElementById('participantMemberInput');
  const name = nameInput.value.trim();
  const memberNumber = memberInput.value.trim();
  if(!name && !memberNumber){ showToast('Enter a name or membership number'); return; }

function removeParticipant(programId, id){
  if(!state.participants[programId]) return;
  state.participants[programId] = state.participants[programId].filter(p=>p.id !== id);
  saveParticipantsRemote();
  updateCounts();
  renderParticipantPanel();
}

function updateParticipantField(programId, id, field, value){
  const list = state.participants[programId];
  if(!list) return;
  const p = list.find(p=>p.id===id);
  if(!p) return;
  p[field] = value.trim();
  saveParticipantsRemote();
}

function renderParticipantList(){
  const wrap = document.getElementById('participantListWrap');
  if(!wrap) return;
  const list = state.participants[selectedParticipantProgramId] || [];

  if(list.length === 0){
    wrap.innerHTML = `<div class="participant-empty-row">No participants added yet.</div>`;
    return;
  }

  wrap.innerHTML = list.map((p, idx)=>`

    </div>
  `).join('');

  wrap.querySelectorAll('.rm-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> removeParticipant(selectedParticipantProgramId, btn.dataset.id));
  });

  wrap.querySelectorAll('.pfield').forEach(span=>{
    span.addEventListener('click', ()=> activateParticipantFieldEdit(span));
    span.addEventListener('keydown', e=>{
      if(e.key === 'Enter') activateParticipantFieldEdit(span);
    });
  });
}

function activateParticipantFieldEdit(span){
  if(span.querySelector('input')) return; // already editing
  const id = span.dataset.id;
  const field = span.dataset.field;
  const list = state.participants[selectedParticipantProgramId] || [];
  const participant = list.find(p=>p.id===id);
  if(!participant) return;
  const currentValue = participant[field] || '';
  const placeholder = field === 'name' ? 'Participant name' : 'Membership number';

  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = placeholder;
  input.className = 'pfield-input';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    updateParticipantField(selectedParticipantProgramId, id, field, input.value);
    renderParticipantList();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderParticipantList();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

const tierMeta = {

  Gold:     { color: 'gold', icon: '<circle cx="12" cy="8" r="5"/><path d="M9 12.5l-1.5 7l4.5 -2l4.5 2l-1.5 -7"/>' },

};

// Pulls a numeric dollar value out of a free-text amount field like "$500",
// "500.50", or "1,200". Returns 0 for blank/unparseable entries so one messy
// entry (e.g. "tbc") doesn't break the running total — it's just skipped.
function parseSponsorAmount(str){
  if(!str) return 0;
  const cleaned = String(str).replace(/[^0-9.]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function getTotalSponsorshipAmount(){
  return state.sponsors.reduce((sum, s)=> sum + parseSponsorAmount(s.amount), 0);
}

function formatCurrency(n){
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

  const customInput = document.getElementById('adminCustomInput');
  presetSelect.addEventListener('change', ()=>{
    customInput.style.display = presetSelect.value === 'Custom…' ? 'block' : 'none';
  });
  document.getElementById('addAdminBtn').addEventListener('click', ()=>{
    let label = presetSelect.value;
    if(label === 'Custom…'){
      label = customInput.value.trim();
      if(!label){ showToast('Enter a slot name'); return; }
    }
    const presetDuration = (label in ADMIN_PRESET_DURATIONS_SECONDS) ? ADMIN_PRESET_DURATIONS_SECONDS[label] : null;
    const adminProgram = createAdminProgramRecord(label, presetDuration);
    state.programs.push(adminProgram);
    saveProgramsRemote(state.programs);

    const item = {
      id: 'seq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      type: 'admin',
      programId: adminProgram.id
    };
    state.sequence.push(item);
    saveSequenceRemote();
    customInput.value = '';
    renderSequenceTab();
    updateCounts();
    showToast('Added "' + label + '" to running order and Tab 1');
  });

  renderPoolList();
  renderSeqList();
}

function renderPoolList(){
  const poolList = document.getElementById('poolList');
  if(!poolList) return;
  const inSeqIds = new Set(state.sequence.map(s=>s.programId));
  const available = state.programs.filter(p=>p.groupConfirmed==='Y' && !p.withdrawn && !inSeqIds.has(p.id));

  if(available.length === 0){
    poolList.innerHTML = `<div class="empty-note">All confirmed programs have been added to the running order.</div>`;
    return;
  }

  poolList.innerHTML = available.map(p=>`
    <div class="pool-item" draggable="true" data-id="${p.id}">
      <div class="info">
        <div class="t">${escapeHtml(p.programName)}</div>
        <div class="s">${escapeHtml(p.category)} · ${escapeHtml(p.submitter)}</div>
      </div>
      <button class="add-btn" data-id="${p.id}" aria-label="Add to running order"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  `).join('');

  poolList.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      addProgramToSequence(btn.dataset.id);
    });
  });

  poolList.querySelectorAll('.pool-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{
      seqDragId = item.dataset.id;
      seqDragType = 'pool';
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', ()=>item.classList.remove('dragging'));
  });
}

function addProgramToSequence(programId){
  const exists = state.sequence.some(s=>s.programId===programId);
  if(exists) return;
  const p = state.programs.find(p=>p.id===programId);
  const itemType = (p && p.isAdminItem) ? 'admin' : 'program';
  state.sequence.push({ id: 'seq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), type: itemType, programId });
  saveSequenceRemote();
  renderSequenceTab();
}

function renderSeqList(){
  const seqList = document.getElementById('seqList');
  if(!seqList) return;

  if(state.sequence.length === 0){
    seqList.innerHTML = `<div class="empty-note">Drag programs here, or click + on items in the pool.</div>`;
  } else {
    seqList.innerHTML = state.sequence.map((item, idx)=>{
      const p = state.programs.find(p=>p.id===item.programId);
      if(!p) return '';
      const subtitle = item.type === 'admin'
        ? 'Admin item'
        : `${escapeHtml(p.category)} · ${p.coordinator ? 'Coord: '+escapeHtml(p.coordinator) : 'No coordinator yet'}`;
      return `
        <div class="seq-item${item.type === 'admin' ? ' admin-slot' : ''}" draggable="true" data-id="${item.id}">
          <span class="num">${idx+1}</span>
          <span class="grip"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg></span>
          <div class="info">
            <div class="t">${escapeHtml(p.programName)}</div>
            <div class="s">${subtitle}</div>
          </div>
          <button class="rm-btn" data-id="${item.id}" aria-label="Remove"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      `;
    }).join('');
  }

  seqList.querySelectorAll('.rm-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const seqItem = state.sequence.find(s=>s.id===btn.dataset.id);
      if(seqItem && seqItem.type === 'admin'){
        withdrawProgram(seqItem.programId);
        return;
      }
      state.sequence = state.sequence.filter(s=>s.id !== btn.dataset.id);
      saveSequenceRemote();
      renderSequenceTab();
    });
  });

  seqList.querySelectorAll('.seq-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{
      seqDragId = item.dataset.id;
      seqDragType = 'seq';
    });
    item.addEventListener('dragover', e=>{
      e.preventDefault();
      item.classList.add('dragover');
    });
    item.addEventListener('dragleave', ()=>item.classList.remove('dragover'));
    item.addEventListener('drop', e=>{
      e.preventDefault();
      item.classList.remove('dragover');
      const targetId = item.dataset.id;
      handleDropOnSeq(targetId);
    });
  });

  seqList.addEventListener('dragover', e=>e.preventDefault());
  seqList.addEventListener('drop', e=>{
    e.preventDefault();
    if(e.target === seqList){
      handleDropOnSeq(null);
    }
  });
}

function handleDropOnSeq(targetId){
  if(seqDragType === 'pool'){
    const exists = state.sequence.some(s=>s.programId===seqDragId);
    if(exists){ seqDragId=null; seqDragType=null; return; }
    const draggedProgram = state.programs.find(p=>p.id===seqDragId);
    const itemType = (draggedProgram && draggedProgram.isAdminItem) ? 'admin' : 'program';
    const newItem = { id: 'seq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), type: itemType, programId: seqDragId };
    if(targetId){
      const idx = state.sequence.findIndex(s=>s.id===targetId);
      state.sequence.splice(idx, 0, newItem);
    } else {
      state.sequence.push(newItem);
    }
  } else if(seqDragType === 'seq'){
    if(targetId === seqDragId){ seqDragId=null; seqDragType=null; return; }
    const fromIdx = state.sequence.findIndex(s=>s.id===seqDragId);
    if(fromIdx === -1){ seqDragId=null; seqDragType=null; return; }
    const [moved] = state.sequence.splice(fromIdx, 1);
    if(targetId){
      const toIdx = state.sequence.findIndex(s=>s.id===targetId);
      state.sequence.splice(toIdx, 0, moved);
    } else {
      state.sequence.push(moved);
    }
  }
  seqDragId = null;
  seqDragType = null;
  saveSequenceRemote();
  renderSequenceTab();
}

// ===================== FINAL TAB =====================
function renderFinalTab(){
  const root = document.getElementById('tab-final');
  updateCounts();

  if(state.sequence.length === 0){
    root.innerHTML = `
      <div class="empty-state">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 17.5l1.5 1.5l2.5 -2.5"/><path d="M11 6h9M11 12h9M11 18h9"/></svg>
        <p>No running order yet. Build one in the Sequence builder tab.</p>
      </div>
    `;
    return;
  }

  const times = computeRunSheetTimes();
  const showEndTime = times.length ? times[times.length-1].endTime : null;
  const showStartTime = (()=>{ const d = new Date(); d.setHours(SHOW_START_TIME.hour, SHOW_START_TIME.minute, 0, 0); return d; })();
  const anyDefaulted = times.some(t=>t.isDefaultDuration);

  const rows = state.sequence.map((item, idx) => {
    const t = times[idx];
    const timingHtml = t
      ? `<div class="ftiming${t.isDefaultDuration ? ' ftiming-default' : ''}">${formatClockTime(t.startTime)} – ${formatClockTime(t.endTime)}${t.isDefaultDuration ? '<span class="ftiming-est">est.</span>' : ''}</div>`
      : `<div class="ftiming">—</div>`;

    const p = state.programs.find(p=>p.id===item.programId);
    if(!p) return '';
    if(item.type === 'admin'){
      return `
        <div class="final-row admin">
          <div class="fnum">${idx+1}</div>
          <div class="finfo">
            <div class="ft">${escapeHtml(p.programName)}</div>
            <div class="fs">Admin item</div>
          </div>
          ${timingHtml}
          <div class="fstatus"><span class="badge-admin">Admin</span></div>
        </div>
      `;
    }
    const statusBadge = p.isPending
      ? `<span class="badge-pending">Name pending</span>`
      : (p.inputsReceived==='Y' ? `<span class="badge-ready">Ready</span>` : `<span class="badge-pending">Awaiting input</span>`);
    return `
      <div class="final-row">
        <div class="fnum">${idx+1}</div>
        <div class="finfo">
          <div class="ft">${escapeHtml(p.programName)}</div>
          <div class="fs">${escapeHtml(p.category)} · ${escapeHtml(p.submitter)}${p.coordinator ? ' · Coord: '+escapeHtml(p.coordinator) : ''}</div>
        </div>
        ${timingHtml}
        <div class="fstatus">${statusBadge}</div>
      </div>
    `;
  }).join('');

  root.innerHTML = `
    <div class="final-header">
      <div class="label">Kalasandhya 2026</div>
      <h2>Final running order</h2>
    </div>
    <div style="background:#FBF1E3;border:1px solid #E8C9A0;border-radius:9px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--marigold-dark);display:flex;align-items:center;gap:8px;">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 9h.01M11 12h1v4h1"/></svg>
      Show starts at ${formatClockTime(showStartTime)}, with a 1.5 min buffer between every item.${anyDefaulted ? ' Items marked "est." are using a default run time — enter the real time in Tab 1 / via admin presets for an accurate run sheet.' : ''}${showEndTime ? ` Estimated finish: ${formatClockTime(showEndTime)}.` : ''}
    </div>
    <div class="actions-bar">
      <button class="btn-secondary" id="exportBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2M7 11l5 5l5 -5M12 4v12"/></svg> Export data</button>
      <button class="btn-secondary" id="importBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2M7 9l5 -5l5 5M12 4v12"/></svg> Import data</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn-secondary" id="printBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2"/><path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg> Print</button>
    </div>
    <div class="panel">
      <div class="final-list">${rows}</div>
    </div>
  `;

  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
}

function exportData(){
  const payload = { programs: state.programs, sequence: state.sequence, sponsors: state.sponsors, participants: state.participants, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kalasandhya-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const payload = JSON.parse(evt.target.result);
      if(payload.programs) state.programs = payload.programs;
      if(payload.sequence){
        const seqMigration = migrateSequence(payload.sequence);
        state.sequence = seqMigration.sequence;
      }
      if(payload.sponsors) state.sponsors = payload.sponsors;
      if(payload.participants) state.participants = payload.participants;
      saveProgramsRemote(state.programs);
      saveSequenceRemote();
      saveSponsorsRemote();
      saveParticipantsRemote();
      updateCounts();
      renderFinalTab();
      showToast('Data imported');
    }catch(err){
      showToast('Could not read that file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===================== INIT =====================
async function init(){
  renderPookalamRing();
  initTabs();
  await initFirebase();
  await loadState();
  updateCounts();
  renderProgramsConfirmedTab();
  renderFirebaseStatusBanner();

  // Cross-tab sync in the same browser, only relevant when running on the
  // localStorage fallback (Firebase's onSnapshot already handles this when configured).
  if(!firebaseReady){
    window.addEventListener('storage', (e)=>{
      if(e.key === STORAGE_KEY_PROGRAMS && e.newValue){
        try{
          state.programs = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='programs-confirmed') renderProgramsConfirmedTab();
          if(activeTab==='programs-needed') renderProgramsNeededTab();
          if(activeTab==='contacts') renderContactsRows();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_SEQUENCE && e.newValue){
        try{
          const seqMigration = migrateSequence(JSON.parse(e.newValue));
          state.sequence = seqMigration.sequence;
          if(seqMigration.programsChanged) saveProgramsRemote(state.programs);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='sequence') renderSequenceTab();
          if(activeTab==='final') renderFinalTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_SPONSORS && e.newValue){
        try{
          state.sponsors = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='sponsors') renderSponsorsTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_PARTICIPANTS && e.newValue){
        try{
          state.participants = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='participants') renderParticipantsTab();
          updateCounts();
        }catch(err){}
      }
    });
  }
}

// ===================== PWA: SERVICE WORKER + INSTALL PROMPT =====================
function repositionInstallBanner(){
  const installBanner = document.getElementById('installBanner');
  const fbBanner = document.getElementById('firebaseStatusBanner');
  if(!installBanner) return;
  const fbVisible = fbBanner && getComputedStyle(fbBanner).display !== 'none';
  installBanner.style.bottom = fbVisible ? fbBanner.offsetHeight + 'px' : '0';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(err=>{
      console.error('Service worker registration failed', err);
    });
  });
}

let deferredInstallPrompt = null;
const INSTALL_DISMISSED_KEY = 'kalasandhya_install_dismissed_v1';

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(localStorage.getItem(INSTALL_DISMISSED_KEY) === 'true') return;
  const banner = document.getElementById('installBanner');
  if(banner){
    banner.style.display = 'flex';
    repositionInstallBanner();
  }
});

document.addEventListener('DOMContentLoaded', ()=>{
  const installBtn = document.getElementById('installBtn');
  const dismissBtn = document.getElementById('dismissInstallBtn');
  const banner = document.getElementById('installBanner');

  if(installBtn){
    installBtn.addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if(banner) banner.style.display = 'none';
    });
  }
  if(dismissBtn){
    dismissBtn.addEventListener('click', ()=>{
      if(banner) banner.style.display = 'none';
      try{ localStorage.setItem(INSTALL_DISMISSED_KEY, 'true'); }catch(e){}
    });
  }
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
});

window.addEventListener('resize', ()=> repositionInstallBanner());

init().catch(err=>{
  console.error('Failed to start app', err);
  const root = document.getElementById('tab-programs-confirmed');
  if(root){
    root.innerHTML = `
      <div class="empty-state">
        <p style="color:var(--maroon);font-weight:600;">Something went wrong loading saved data.</p>
        <p style="margin-top:8px;">Try a hard refresh. If that doesn't help, clear this site's local storage from your browser's developer tools, or open the file in a private/incognito window to start fresh.</p>
      </div>
    `;
  }
});
</script>
