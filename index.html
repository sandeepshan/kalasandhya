<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalasandhya 2026 — Program Coordination</title>

<!-- PWA: manifest + theme -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F4D2E">
<meta name="description" content="Cultural program coordination and running order for Kalasandhya 2026">

<!-- Icons -->
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- iOS: enables full-screen "app" behaviour when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalasandhya">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --maroon:#7A1F2B;
    --maroon-dark:#4A1019;
    --green:#1F4D2E;
    --green-dark:#123320;
    --green-light:#E8F0E5;
    --marigold:#E8943A;
    --marigold-dark:#A8631C;
    --gold:#C7972A;
    --ivory:#FBF4E6;
    --ivory-dark:#F2E6CC;
    --ink:#2B2420;
    --ink-soft:#6B5F52;
    --line:#E0D3B8;
    --white:#FFFFFF;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Tiro Devanagari Sanskrit', 'Cormorant Garamond', Georgia, serif;}

  /* ===== Pookalam header ===== */
  .pookalam-header{
    position:relative;
    background:var(--green);
    overflow:hidden;
    padding:0;
  }
  .pookalam-ring{
    width:100%;
    height:64px;
    display:block;
  }
  .header-content{
    padding:28px 32px 32px;
    text-align:center;
    position:relative;
  }
  .header-content .eyebrow{
    font-size:13px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--marigold);
    font-weight:600;
    margin:0 0 6px;
  }
  .header-content h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--ivory);
    font-size:42px;
    font-weight:600;
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .header-content .sub{
    color:#CFE0CC;
    font-size:15px;
    margin:0;
  }
  .pookalam-ring-bottom{
    width:100%;
    height:18px;
    display:block;
    transform:rotate(180deg);
  }

  /* ===== Event poster (collapsible) ===== */
  .poster-section{
    background:var(--white);
    border-bottom:1px solid var(--line);
  }
  .poster-toggle{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    background:none;
    border:none;
    padding:12px 16px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    color:var(--green-dark);
  }
  .poster-toggle:hover{background:var(--green-light);}
  .poster-toggle .ico{width:18px;height:18px;flex-shrink:0;}
  .poster-toggle .chevron{transition:transform 0.2s ease;}
  .poster-toggle.expanded .chevron{transform:rotate(180deg);}
  .poster-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 16px;
  }
  .poster-body.expanded{
    max-height:900px;
    padding:0 16px 18px;
  }
  .poster-body img{
    max-width:320px;
    width:100%;
    border-radius:var(--radius-lg);
    border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
    cursor:zoom-in;
  }
  .poster-fullsize-btn{
    margin-top:10px;
    border:1.5px solid var(--green);
    background:var(--white);
    color:var(--green);
    padding:7px 16px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .poster-fullsize-btn:hover{background:var(--green);color:var(--white);}
  .poster-fullsize-btn .ico{width:14px;height:14px;}

  .poster-lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(18,15,12,0.92);
    z-index:300;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .poster-lightbox.show{display:flex;}
  .poster-lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .poster-lightbox-close{
    position:absolute;
    top:18px;
    right:18px;
    background:rgba(255,255,255,0.12);
    border:none;
    color:var(--white);
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .poster-lightbox-close:hover{background:rgba(255,255,255,0.22);}
  .poster-lightbox-close .ico{width:20px;height:20px;}

  /* ===== Tab nav ===== */
  .tabbar{
    display:flex;
    gap:4px;
    background:var(--white);
    border-bottom:2px solid var(--line);
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:50;
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:none;
    padding:16px 20px 14px;
    font-size:15px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tab-btn .count{
    background:var(--ivory-dark);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    padding:1px 7px;
    border-radius:10px;
  }
  .tab-btn.active{
    color:var(--maroon);
    border-bottom-color:var(--marigold);
  }
  .tab-btn.active .count{
    background:var(--marigold);
    color:var(--white);
  }
  .tab-btn:hover{color:var(--maroon);}

  .container{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .search-input{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
  }
  .search-input:focus{outline:none;border-color:var(--marigold);}
  select.filter-select{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .stat-pills{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .stat-pill{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-pill b{color:var(--ink);font-weight:700;}
  .stat-pill.warn{border-color:#E8C9A0;background:#FBF1E3;color:var(--marigold-dark);}
  .stat-pill.warn b{color:var(--marigold-dark);}
  .stat-pill.ok{border-color:#BFD8C2;background:#EEF6EE;color:var(--green);}
  .stat-pill.ok b{color:var(--green);}

  /* ===== Category breakdown cards ===== */
  .category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .category-card{
    border-radius:var(--radius-lg);
    padding:16px 14px;
    text-align:center;
    border:1px solid transparent;
  }
  .cc-icon{width:26px;height:26px;margin-bottom:8px;}
  .cc-count{font-family:'Cormorant Garamond', Georgia, serif;font-size:28px;font-weight:700;line-height:1;}
  .cc-label{font-size:12.5px;font-weight:600;margin-top:4px;opacity:0.85;}
  .cc-coral{background:#FAECE7;color:#8A3B1E;border-color:#F0997B;}
  .cc-teal{background:#E1F5EE;color:#0F6E56;border-color:#5DCAA5;}
  .cc-amber{background:#FAEEDA;color:#854F0B;border-color:#EF9F27;}
  .cc-purple{background:#EEEDFE;color:#3C3489;border-color:#7F77DD;}
  .cc-gray{background:#F1EFE8;color:#444441;border-color:#B4B2A9;}

  /* ===== Sponsor tiers ===== */
  .tier-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .sponsor-total-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--green-light);
    border:1.5px solid var(--green);
    border-radius:var(--radius-lg);
    padding:16px 20px;
    margin-bottom:16px;
  }
  .sponsor-total-banner .stb-label{
    font-size:13px;
    font-weight:700;
    color:var(--green-dark);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .sponsor-total-banner .stb-amount{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:32px;
    font-weight:700;
    color:var(--green-dark);
  }
  .tier-card{
    border-radius:var(--radius-lg);
    padding:16px 14px;
    text-align:center;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .tier-card:hover{transform:translateY(-2px);}
  .tier-card.active{box-shadow:0 0 0 2px currentColor inset;}
  .tier-icon{width:26px;height:26px;margin-bottom:8px;}
  .tier-count{font-family:'Cormorant Garamond', Georgia, serif;font-size:28px;font-weight:700;line-height:1;}
  .tier-label{font-size:12.5px;font-weight:700;margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;}
  .tier-platinum{background:#EEF1F4;color:#3D4A57;border-color:#A9B7C4;}
  .tier-gold{background:#FBF1D7;color:#8A6310;border-color:var(--gold);}
  .tier-silver{background:#F1F2F3;color:#5B5F63;border-color:#B7BABD;}
  .tier-bronze{background:#F5E6D8;color:#8A4F1E;border-color:#C98549;}

  .sponsor-form{
    display:grid;
    grid-template-columns:1.3fr 1fr 0.9fr auto;
    gap:8px;
    margin-bottom:16px;
  }
  .sponsor-form-extended{
    grid-template-columns:1.2fr 1fr 0.9fr 0.8fr 0.8fr auto;
  }
  .sponsor-form input, .sponsor-form select{
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .sponsor-form button{
    border:none;
    background:var(--marigold);
    color:var(--white);
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .sponsor-form button:hover{background:var(--marigold-dark);}

  .sponsor-section{margin-bottom:22px;}
  .sponsor-section-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .sponsor-section-header .tier-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .tier-dot.tier-platinum{background:#A9B7C4;}
  .tier-dot.tier-gold{background:var(--gold);}
  .tier-dot.tier-silver{background:#B7BABD;}
  .tier-dot.tier-bronze{background:#C98549;}
  .sponsor-section-header h4{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:18px;
    margin:0;
    color:var(--ink);
  }
  .sponsor-section-header .tier-tag-count{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--ivory-dark);
    padding:1px 9px;
    border-radius:999px;
  }
  .sponsor-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .sponsor-row{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .sponsor-row .sname{font-size:14px;font-weight:700;color:var(--ink);}
  .sponsor-row .scontact{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .sponsor-row .sinfo{flex:1;min-width:0;}
  .sponsor-row select.tier-select{
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:5px 8px;
    font-size:12.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .sfield{
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid transparent;
    min-width:70px;
    text-align:center;
  }
  .sfield:hover{background:var(--ivory);border-color:var(--line);}
  .sfield-amount{font-weight:700;color:var(--green-dark);}
  .sfield-empty{color:var(--ink-soft);font-style:italic;font-weight:400;}
  .sfield-input{
    border:1.5px solid var(--marigold);
    border-radius:6px;
    padding:3px 7px;
    font-size:13px;
    font-family:inherit;
    width:90px;
    background:var(--white);
    color:var(--ink);
    outline:none;
    text-align:center;
  }
  .sponsor-row button.rm-btn{
    border:none;
    background:none;
    color:var(--maroon);
    font-size:18px;
    cursor:pointer;
    width:24px;height:24px;
    flex-shrink:0;
  }

  /* ===== Participants tab ===== */
  .participant-picker{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .participant-picker select{
    flex:1;
    min-width:240px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .participant-picker select:focus{outline:none;border-color:var(--marigold);}
  .participant-panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 20px;
  }
  .participant-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:4px;
  }
  .participant-panel-header h3{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:21px;
    color:var(--maroon);
    margin:0;
  }
  .participant-panel-header .pcount{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--ivory-dark);
    padding:2px 10px;
    border-radius:999px;
  }
  .participant-original-note{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--ivory);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:9px 12px;
    margin:10px 0 16px;
  }
  .participant-original-note button{
    border:none;
    background:none;
    color:var(--maroon);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    font-family:inherit;
    padding:0;
    margin-left:6px;
  }
  .participant-add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .participant-add-row input{
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--white);
    color:var(--ink);
  }
  .participant-add-row input.pname-input{flex:1.6;}
  .participant-add-row input.pmember-input{flex:1;}
  .participant-add-row button{
    border:none;
    background:var(--marigold);
    color:var(--white);
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .participant-add-row button:hover{background:var(--marigold-dark);}
  .participant-list{
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .participant-row{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 13px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .participant-row .pnum{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:700;
    color:var(--gold);
    font-size:15px;
    min-width:20px;
  }
  .participant-row .pinfo{flex:1;min-width:0;}
  .pinfo-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:14px;
    align-items:center;
  }
  .pfield{
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid transparent;
    display:inline-block;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .pfield:hover{background:var(--white);border-color:var(--line);}
  .pfield:nth-child(1){font-weight:700;}
  .pfield-member{font-size:12.5px;color:var(--ink-soft);}
  .pfield-empty{color:var(--ink-soft);font-style:italic;font-weight:400;}
  .pfield-input{
    border:1.5px solid var(--marigold);
    border-radius:6px;
    padding:3px 7px;
    font-size:13.5px;
    font-family:inherit;
    width:100%;
    background:var(--white);
    color:var(--ink);
    outline:none;
  }
  .participant-row button.rm-btn{
    border:none;
    background:none;
    color:var(--maroon);
    cursor:pointer;
    width:22px;height:22px;
    flex-shrink:0;
  }
  .participant-empty-row{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:24px 10px;
    border:1.5px dashed var(--line);
    border-radius:9px;
  }
  .no-program-selected{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }

  /* ===== Program cards / table ===== */
  .program-table{
    width:100%;
    border-collapse:collapse;
    background:var(--white);
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .program-table thead th{
    background:var(--green);
    color:var(--ivory);
    text-align:left;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    padding:12px 14px;
    position:sticky;
    top:0;
  }
  .program-table tbody tr{
    border-bottom:1px solid var(--ivory-dark);
  }
  .program-table tbody tr:last-child{border-bottom:none;}
  .program-table tbody tr:hover{background:#FBF8F1;}
  .program-table td{
    padding:12px 14px;
    font-size:13.5px;
    vertical-align:top;
  }
  .pname{font-weight:700;color:var(--ink);font-size:14px;}
  .pname.pending{color:var(--ink-soft);font-style:italic;font-weight:600;}
  .psub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
  .cat-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
  }
  .cat-Group-Dance{background:#F4E3DD;color:#8A3B1E;}
  .cat-Group-Song{background:#E1ECE0;color:#2C5836;}
  .cat-Thiruvathirakali{background:#F6E6C8;color:#8A6310;}
  .cat-Other{background:#E7E2EE;color:#4A3D77;}

  select.category-select{
    font-size:11.5px;
    font-weight:700;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid transparent;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    max-width:140px;
  }
  select.cat-select-Group-Dance{background:#F4E3DD;color:#8A3B1E;}
  select.cat-select-Group-Song{background:#E1ECE0;color:#2C5836;}
  select.cat-select-Thiruvathirakali{background:#F6E6C8;color:#8A6310;}
  select.cat-select-Other{background:#E7E2EE;color:#4A3D77;}
  select.cat-select-Admin-item{background:#F1EFE8;color:#444441;}

  select.coord-select, input.timing-input{
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:6px 8px;

    font-family:inherit;

  .yn-toggle{

  .yn-toggle button.no.active{background:var(--maroon);color:var(--white);}
  .yn-toggle-locked{opacity:0.55;}

  .withdraw-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    width:26px;height:26px;
    flex-shrink:0;
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .withdraw-btn:hover{color:var(--maroon);background:var(--green-light);}
  .withdraw-btn .ico{width:16px;height:16px;}

  .restore-btn{
    border:1.5px solid var(--green);
    background:var(--white);
    color:var(--green);
    padding:6px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .restore-btn:hover{background:var(--green);color:var(--white);}
  .restore-btn .ico{width:14px;height:14px;}

  .delete-forever-btn{
    border:1.5px solid var(--maroon);
    background:var(--white);
    color:var(--maroon);
    padding:6px 9px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:6px;
  }
  .delete-forever-btn:hover{background:var(--maroon);color:var(--white);}
  .delete-forever-btn .ico{width:14px;height:14px;}

  /* ===== Sequence builder tab ===== */
  .seq-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
  @media (max-width:900px){.seq-layout{grid-template-columns:1fr;}}
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 18px 20px;
  }
  .panel h3{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:20px;
    color:var(--maroon);
    margin:0 0 4px;
  }
  .panel .panel-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .pool-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:560px;
    overflow-y:auto;
    padding-right:4px;
  }
  .pool-item{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    cursor:grab;
  }
  .pool-item.dragging{opacity:0.4;}
  .pool-item .info{min-width:0;}
  .pool-item .info .t{font-size:13.5px;font-weight:700;color:var(--ink);}
  .pool-item .info .s{font-size:11.5px;color:var(--ink-soft);}
  .pool-item button.add-btn{
    border:none;
    background:var(--green);
    color:var(--white);
    width:26px;height:26px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    line-height:1;
  }
  .pool-item button.add-btn:hover{background:var(--green-dark);}

  .admin-add-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .admin-add-row select, .admin-add-row input{
    flex:1;
    padding:8px 10px;
    border:1.5px solid var(--line);
    border-radius:7px;
    font-size:13px;
    font-family:inherit;
  }
  .admin-add-row button{
    border:none;
    background:var(--marigold);
    color:var(--white);
    padding:8px 16px;
    border-radius:7px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .admin-add-row button:hover{background:var(--marigold-dark);}

  .seq-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:120px;
  }
  .seq-item{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:grab;
  }
  .seq-item.dragover{border-color:var(--marigold);background:#FFF8EE;}
  .seq-item .num{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:700;
    font-size:18px;
    color:var(--gold);
    min-width:24px;
  }
  .seq-item .grip{color:var(--ink-soft);font-size:14px;cursor:grab;padding:0 2px;}
  .seq-item .info{flex:1;min-width:0;}
  .seq-item .info .t{font-size:13.5px;font-weight:700;color:var(--ink);}
  .seq-item .info .s{font-size:11.5px;color:var(--ink-soft);}
  .seq-item.admin-slot{background:var(--green-light);border-color:#BFD8C2;}
  .seq-item.admin-slot .info .t{color:var(--green-dark);}
  .seq-item button.rm-btn{
    border:none;
    background:none;
    color:var(--maroon);
    font-size:18px;
    cursor:pointer;
    width:24px;height:24px;
    flex-shrink:0;
  }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 10px;
    border:1.5px dashed var(--line);
    border-radius:9px;
  }

  /* ===== Final tab ===== */
  .final-header{
    text-align:center;
    margin-bottom:24px;
  }
  .final-header .label{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--marigold-dark);
    font-weight:700;
  }
  .final-header h2{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:30px;
    color:var(--maroon);
    margin:4px 0 0;
  }
  .final-list{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .final-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 6px;
    border-bottom:1px solid var(--ivory-dark);
  }
  .final-row:last-child{border-bottom:none;}
  .final-row .fnum{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:22px;
    font-weight:700;
    color:var(--gold);
    min-width:34px;
    text-align:center;
  }
  .final-row .finfo{flex:1;min-width:0;}
  .final-row .finfo .ft{font-size:15px;font-weight:700;color:var(--ink);}
  .final-row .finfo .fs{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .final-row.admin .finfo .ft{color:var(--green-dark);}
  .final-row .ftiming{
    font-size:12.5px;
    color:var(--ink-soft);
    min-width:118px;
    text-align:right;
    white-space:nowrap;
  }
  .final-row .ftiming-default{color:var(--marigold-dark);}
  .ftiming-est{
    display:inline-block;
    margin-left:5px;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    background:#FBF1E3;
    color:var(--marigold-dark);
    padding:1px 5px;
    border-radius:5px;
  }
  .final-row .fstatus{min-width:74px;text-align:right;}
  .badge-ready{background:#E1ECE0;color:#2C5836;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-pending{background:#F6E1C8;color:#8A5710;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-ok{background:#EFEFEF;color:#888;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .badge-admin{background:#E7E2EE;color:#4A3D77;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}

  .actions-bar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:18px;
  }
  .btn-secondary{
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-secondary:hover{border-color:var(--marigold);}
  .btn-secondary:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-secondary:disabled:hover{border-color:var(--line);}

  .btn-primary{
    border:1.5px solid var(--marigold);
    background:var(--marigold);
    color:var(--white);
    padding:9px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary:hover{background:var(--marigold-dark);border-color:var(--marigold-dark);}
  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;background:var(--marigold);border-color:var(--marigold);}

  /* Dashboard tab */
  .dash-attn-list, .dash-coord-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .dash-attn-row{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 14px;
    display:grid;
    grid-template-columns:1fr 160px 110px 160px 90px;
    align-items:center;
    gap:6px 10px;
  }
  .dash-attn-name{font-weight:700;color:var(--ink);font-size:13.5px;}
  .dash-attn-meta{font-size:12px;color:var(--ink-soft);}
  .dash-attn-badge{display:flex;justify-content:center;}
  @media(max-width:700px){
    .dash-attn-row{grid-template-columns:1fr;gap:5px;}
    .dash-attn-badge{justify-content:flex-start;}
  }
  .dash-empty{color:var(--ink-soft);font-size:13.5px;padding:8px 2px;}
  .dash-coord-row{
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 14px;
  }
  .dash-coord-name{font-weight:700;color:var(--maroon);font-size:13.5px;margin-bottom:6px;}
  .dash-coord-bar-wrap{display:flex;align-items:center;gap:10px;}
  .dash-coord-bar{flex:1;height:8px;border-radius:99px;background:#EFE6D6;overflow:hidden;}
  .dash-coord-bar-fill{height:100%;background:var(--marigold);border-radius:99px;}
  .dash-coord-pct{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .dash-coord-pending{font-size:12px;color:var(--marigold-dark);margin-top:6px;}

  /* Presenter view */
  .presenter-stage{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:14px;
  }
  .presenter-now-card{
    background:var(--maroon);
    color:var(--ivory);
    border-radius:var(--radius-lg);
    padding:28px 26px;
    text-align:center;
  }
  .presenter-up-next{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:12px 18px;
  }
  .presenter-next-name{font-weight:700;color:var(--maroon);font-size:15px;flex:1;}
  .presenter-next-time{font-size:13px;color:var(--marigold-dark);font-weight:700;}
  .presenter-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    opacity:0.75;
    margin-bottom:8px;
    font-weight:700;
    white-space:nowrap;
  }
  .presenter-now-card .presenter-title{font-size:clamp(28px,5vw,44px);font-family:'Cormorant Garamond', Georgia, serif;font-weight:700;line-height:1.15;}
  .presenter-sub{font-size:13px;opacity:0.85;margin-top:6px;}
  .presenter-time{font-size:15px;font-weight:700;margin-top:12px;opacity:0.9;}
  .presenter-empty{color:var(--ink-soft);font-size:13.5px;padding:10px 0;}
  .presenter-controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:12px;
  }
  .presenter-controls .btn-primary, .presenter-controls .btn-secondary{padding:13px 26px;font-size:14.5px;}
  .presenter-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}

  /* Retro table */
  .retro-table{width:100%;border-collapse:collapse;font-size:13px;}
  .retro-table thead th{text-align:left;padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--ink-soft);border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:0.04em;}
  .retro-row td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .retro-row:last-child td{border-bottom:none;}
  .retro-current td{background:#FFF8EE;}
  .retro-current .retro-name{font-weight:700;color:var(--maroon);}
  .retro-done td{opacity:0.6;}
  .retro-num{color:var(--ink-soft);font-size:12px;text-align:center;}
  .retro-name{font-weight:600;}
  .retro-planned{color:var(--ink-soft);}
  .retro-actual-time{font-weight:700;color:var(--maroon);}
  .retro-diff{font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;margin-left:4px;}
  .retro-diff.late{background:#FDECEA;color:#B71C1C;}
  .retro-diff.early{background:#E8F5E9;color:#1B5E20;}
  .retro-time-input{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:4px 8px;
    width:90px;
    background:var(--white);
  }
  .retro-time-input:focus{outline:none;border-color:var(--marigold);}
  .retro-time-input::-webkit-calendar-picker-indicator{opacity:0.5;cursor:pointer;}


  /* Countdown banner */
  .countdown-banner{
    display:none;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    text-align:center;
    background:linear-gradient(90deg, var(--marigold), var(--gold));
    color:var(--maroon-dark);
    font-weight:700;
    font-size:13.5px;
    padding:9px 16px;
  }
  .countdown-banner.show{display:flex;}
  .countdown-banner .cd-num{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:19px;
    font-weight:700;
    margin:0 2px;
  }
  .countdown-banner.cd-today{background:linear-gradient(90deg, var(--maroon), var(--marigold-dark));color:var(--ivory);}

  /* Weather + venue block */
  .weather-venue-panel{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    background:#FBF1E3;
    border:1px solid #E8C9A0;
    border-radius:var(--radius-lg);
    padding:16px 18px;
    margin-bottom:18px;
  }
  .weather-block{display:flex;align-items:center;gap:10px;}
  .weather-temp{font-family:'Cormorant Garamond', Georgia, serif;font-size:30px;font-weight:700;color:var(--maroon);}
  .weather-desc{font-size:12.5px;color:var(--ink-soft);}
  .weather-venue-divider{width:1px;align-self:stretch;background:#E8C9A0;}
  .venue-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:var(--marigold-dark);
    font-weight:700;
    font-size:13px;
    text-decoration:none;
  }
  .venue-link:hover{text-decoration:underline;}

  /* Confetti canvas */
  #confettiCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
  }

  /* WhatsApp nudge panel */
  .wa-panel{ display:flex; flex-direction:column; gap:10px; }
  .wa-row{
    background:var(--ivory); border:1px solid var(--line);
    border-radius:9px; padding:12px 14px;
    display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap;
  }
  .wa-info{ flex:1 1 200px; }
  .wa-name{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .wa-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .wa-copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; padding:7px 14px;
    border-radius:7px; border:1.5px solid #25D366;

    white-space:nowrap; flex-shrink:0;
  }
  .wa-copy-btn:hover{ background:#1ebe5d; border-color:#1ebe5d; }
  .wa-copy-btn.copied{ background:#2C5836; border-color:#2C5836; }
  .wa-deadline-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }

  .wa-deadline-input{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);

  .pb-footer{ border-top:2px solid #7A1F2B; padding-top:9px; display:flex; justify-content:space-between; align-items:center; font-size:8pt; color:#aaa; }

  }
  .empty-state i{font-size:34px;color:var(--line);}
  .empty-state p{font-size:14px;margin-top:10px;}

  .toast{
    position:fixed;

async function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") return;
  try{
    const timeout = new Promise((_, reject)=>setTimeout(()=>reject(new Error('Firebase load timed out')), 6000));
    const loadModules = Promise.all([
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
    ]);
    const [{ initializeApp }, firestoreMod] = await Promise.race([loadModules, timeout]);
    doc = firestoreMod.doc;
    setDoc = firestoreMod.setDoc;
    onSnapshot = firestoreMod.onSnapshot;
    const app = initializeApp(firebaseConfig);
    db = firestoreMod.getFirestore(app);
    DOC_PROGRAMS = doc(db, 'kalasandhya', 'programs');

    DOC_LIVE = doc(db, 'kalasandhya', 'live');
    firebaseReady = true;
  }catch(e){
    console.error('Firebase failed to load, falling back to local storage', e);
    firebaseReady = false;
    firebaseError = e.message || String(e);
  }
}

function renderFirebaseStatusBanner(){
  const el = document.getElementById('firebaseStatusBanner');

  const attemptedFirebase = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
  if(!attemptedFirebase || !firebaseError){
    el.style.display = 'none';
    el.innerHTML = '';
    repositionInstallBanner();
    return;
  }
  el.className = 'fb-status-banner';
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="fb-msg">⚠ Live sync isn't connecting — running on this browser's local storage instead.</span>
    <span class="fb-detail">${escapeHtml(firebaseError)}</span>
    <button id="dismissFbBanner">Dismiss</button>
  `;
  document.getElementById('dismissFbBanner').addEventListener('click', ()=>{
    el.style.display = 'none';
    repositionInstallBanner();
  });
  repositionInstallBanner();
}

// Data layer: Firebase Firestore when configured (live multi-device sync),
// falling back to browser localStorage (this device/browser only) if the
// firebaseConfig above still has placeholder values.

}

// Backfills any fields that didn't exist yet when older data was cached
// (e.g. earlier sessions before submitterEmail/submitterPhone existed),
// so a schema change here never breaks a returning visitor's saved data.
function migratePrograms(cached){
  const fresh = buildPrograms();
  const freshById = new Map(fresh.map(p=>[p.id, p]));
  let changed = false;
  const merged = cached.map(p=>{
    const defaults = freshById.get(p.id);
    if(!defaults) return p;
    const filled = { ...defaults, ...p };
    // Migrate the old single "inputsReceived" field into the new split
    // participantsReceived / avReceived fields, preserving existing data.
    if(p.inputsReceived != null && p.participantsReceived == null){
      filled.participantsReceived = p.inputsReceived;
      delete filled.inputsReceived;
    }
    if(JSON.stringify(filled) !== JSON.stringify(p)) changed = true;
    return filled;
  });
  return { merged, changed };
}

// Upgrades the old admin-item shape ({type:'admin', label}, no programId) into
// the current shape, where every admin item is backed by a real record in
// state.programs (so Tab 1 editing and the running order share one source of truth).
// Mutates state.programs in place when it needs to create backing records.
// Returns { sequence, programsChanged }.
function migrateSequence(sequence){
  if(!Array.isArray(sequence)) return { sequence: [], programsChanged: false };
  let programsChanged = false;
  const migrated = sequence.map(item=>{
    if(item.type === 'admin' && !item.programId){
      const presetDuration = (item.label in ADMIN_PRESET_DURATIONS_SECONDS) ? ADMIN_PRESET_DURATIONS_SECONDS[item.label] : null;
      const adminProgram = createAdminProgramRecord(item.label || 'Admin item', presetDuration);
      state.programs.push(adminProgram);
      programsChanged = true;
      return { id: item.id, type: 'admin', programId: adminProgram.id };
    }
    return item;
  });
  return { sequence: migrated, programsChanged };
}

function loadStateLocal(){
  let programs = null, sequence = null, sponsors = null, participants = null, live = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY_PROGRAMS);
    if(raw) programs = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_SEQUENCE);
    if(raw) sequence = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_SPONSORS);
    if(raw) sponsors = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_PARTICIPANTS);
    if(raw) participants = JSON.parse(raw);
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LIVE);
    if(raw) live = JSON.parse(raw);
  }catch(e){}

  if(!programs){
    programs = buildPrograms();
    saveProgramsRemote(programs);
  } else {
    const { merged, changed } = migratePrograms(programs);
    programs = merged;
    if(changed) saveProgramsRemote(programs);
  }
  state.programs = programs;
  const seqMigration = migrateSequence(sequence || []);
  state.sequence = seqMigration.sequence;
  if(seqMigration.programsChanged){
    saveProgramsRemote(state.programs);
    saveSequenceRemote();
  }
  state.sponsors = sponsors || [];
  state.participants = participants || {};
  state.live = live || { currentIndex: -1 };
  state.loaded = true;
}

function loadStateFirebase(){
  return new Promise((resolve)=>{
    let progLoaded = false;
    let seqLoaded = false;
    let sponsorsLoaded = false;
    let participantsLoaded = false;
    let resolved = false;
    function maybeResolve(){
      if(progLoaded && seqLoaded && sponsorsLoaded && participantsLoaded && !resolved){
        resolved = true;
        state.loaded = true;
        resolve();
      }
    }

    unsubPrograms = onSnapshot(DOC_PROGRAMS, (snap)=>{
      if(suppressNextProgramsSnapshot){ suppressNextProgramsSnapshot = false; }
      else if(snap.exists() && snap.data().items){
        const { merged, changed } = migratePrograms(snap.data().items);
        state.programs = merged;
        if(changed) saveProgramsRemote(merged);
      } else if(!progLoaded){
        const fresh = buildPrograms();
        state.programs = fresh;
        setDoc(DOC_PROGRAMS, { items: fresh });
      }
      progLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore programs sync error', err);
      firebaseError = err.message || String(err);
      showToast('Could not connect to live sync — check Firebase setup');
      progLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubSequence = onSnapshot(DOC_SEQUENCE, (snap)=>{
      if(suppressNextSequenceSnapshot){
        suppressNextSequenceSnapshot = false;
        seqLoaded = true;
        maybeResolve();
        refreshActiveTab();
        return;
      }

      const rawSequence = (snap.exists() && snap.data().items) ? snap.data().items : [];
      const applyMigration = ()=>{
        const seqMigration = migrateSequence(rawSequence);
        state.sequence = seqMigration.sequence;
        if(seqMigration.programsChanged){
          saveProgramsRemote(state.programs);
          saveSequenceRemote();
        }
        seqLoaded = true;
        maybeResolve();
        refreshActiveTab();
      };

      if(progLoaded){
        applyMigration();
      } else {
        // Programs haven't loaded yet — wait for them so migration has
        // the real program list to append backing records to.
        const waitForPrograms = setInterval(()=>{
          if(progLoaded){
            clearInterval(waitForPrograms);
            applyMigration();
          }
        }, 100);
      }
    }, (err)=>{
      console.error('Firestore sequence sync error', err);
      firebaseError = err.message || String(err);
      seqLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubSponsors = onSnapshot(DOC_SPONSORS, (snap)=>{
      if(suppressNextSponsorsSnapshot){ suppressNextSponsorsSnapshot = false; }
      else {
        state.sponsors = (snap.exists() && snap.data().items) ? snap.data().items : [];
      }
      sponsorsLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore sponsors sync error', err);
      firebaseError = err.message || String(err);
      sponsorsLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubParticipants = onSnapshot(DOC_PARTICIPANTS, (snap)=>{
      if(suppressNextParticipantsSnapshot){ suppressNextParticipantsSnapshot = false; }
      else {
        state.participants = (snap.exists() && snap.data().items) ? snap.data().items : {};
      }
      participantsLoaded = true;
      maybeResolve();
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore participants sync error', err);
      firebaseError = err.message || String(err);
      participantsLoaded = true;
      maybeResolve();
      renderFirebaseStatusBanner();
    });

    unsubLive = onSnapshot(DOC_LIVE, (snap)=>{
      if(suppressNextLiveSnapshot){ suppressNextLiveSnapshot = false; }
      else {
        state.live = (snap.exists() && snap.data()) ? snap.data() : { currentIndex: -1 };
      }
      refreshActiveTab();
    }, (err)=>{
      console.error('Firestore live sync error', err);
    });

    setTimeout(()=>{ if(!resolved){ resolved = true; state.loaded = true; resolve(); } }, 4000);
  });
}

// ===================== POOKALAM RING SVG =====================
function renderPookalamRing(){
  const svg = document.getElementById('ringTop');
  const colors = ['#E8943A','#7A1F2B','#C7972A','#FBF4E6','#E8943A','#C7972A'];
  let html = '';
  const w = 1200, h = 64;
  const cy = 0;
  for(let ring=0; ring<3; ring++){
    const r = 30 + ring*14;
    const color = colors[ring % colors.length];
    const n = 26 - ring*4;
    for(let i=0;i<n;i++){
      const angle = (i/n) * Math.PI;
      const spacing = w / n;
      const x = i*spacing + spacing/2;
      const yOffset = Math.sin(angle*0)*0;
      html += `<circle cx="${x}" cy="${10+ring*16}" r="${5-ring}" fill="${color}" opacity="${0.85 - ring*0.15}"/>`;
    }
  }
  // simple repeating petal motif instead (cleaner)
  html = '';
  const petalColors = ['#E8943A','#FBF4E6','#7A1F2B','#C7972A'];
  const spacing = 46;
  const count = Math.ceil(w/spacing)+1;
  for(let i=0;i<count;i++){
    const x = i*spacing;
    const c1 = petalColors[i%4];
    html += `<circle cx="${x}" cy="14" r="6" fill="${c1}" opacity="0.9"/>`;
    html += `<circle cx="${x+spacing/2}" cy="34" r="9" fill="${petalColors[(i+1)%4]}" opacity="0.85"/>`;
    html += `<circle cx="${x}" cy="52" r="4" fill="${petalColors[(i+2)%4]}" opacity="0.7"/>`;
  }
  svg.innerHTML = html;
}

// ===================== TABS =====================
function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      ['dashboard','presenter','programs-confirmed','contacts','participants','whatsapp','sponsors','sequence','final','deleted'].forEach(t=>{
        document.getElementById('tab-'+t).style.display = (t===tab) ? 'block' : 'none';
      });
      if(tab==='dashboard') renderDashboardTab();
      if(tab==='presenter') renderPresenterTab();
      if(tab==='programs-confirmed') renderProgramsConfirmedTab();
      if(tab==='contacts') renderContactsTab();
      if(tab==='participants') renderParticipantsTab();
      if(tab==='whatsapp') renderWhatsappTab();
      if(tab==='sponsors') renderSponsorsTab();
      if(tab==='sequence') renderSequenceTab();
      if(tab==='final') renderFinalTab();
      if(tab==='deleted') renderDeletedTab();
    });
  });
}

let confirmedFilters = { search:'', category:'', status:'', coordinator:'' };

function getDedupedContacts(){
  const map = new Map();
  state.programs.forEach(p=>{
    if(isEffectivelyAdminItem(p)) return;
    const submitterEmail = p.submitterEmail || '';
    const submitterPhone = p.submitterPhone || '';
    const emailKey = submitterEmail.trim().toLowerCase();
    const nameKey = (p.submitter || '').trim().toLowerCase();
    const key = emailKey || nameKey;
    if(!key) return;
    if(!map.has(key)){
      map.set(key, {
        name: (p.submitter || '').trim(),
        email: submitterEmail.trim(),
        phone: submitterPhone.trim(),
        programs: []
      });
    }
    map.get(key).programs.push(p.programName);
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function updateCounts(){
  const active = state.programs.filter(p=>!p.withdrawn);
  document.getElementById('countProgramsConfirmed').textContent = active.length;
  document.getElementById('countContacts').textContent = getDedupedContacts().length;
  document.getElementById('countParticipants').textContent = Object.values(state.participants).reduce((sum, list) => sum + list.length, 0);
  document.getElementById('countSponsors').textContent = state.sponsors.length;
  const deletedCountEl = document.getElementById('countDeleted');
  if(deletedCountEl) deletedCountEl.textContent = getWithdrawnPrograms().length;
  document.getElementById('countFinal').textContent = state.sequence.length;
  renderCountdownBanner();
  checkSponsorMilestone();
}

function buildCategoryGrid(programs){
  const counts = {};
  programs.forEach(p=>{ counts[p.category] = (counts[p.category]||0) + 1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([cat,count])=>{
    const meta = categoryMeta[cat] || defaultCategoryMeta;
    return `
      <div class="category-card cc-${meta.color}">
        <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${meta.icon}</svg>
        <div class="cc-count">${count}</div>
        <div class="cc-label">${escapeHtml(cat)}</div>
      </div>
    `;
  }).join('');
}

function renderProgramsConfirmedTab(){
  renderProgramsTabShell({
    rootId: 'tab-programs-confirmed',
    tbodyId: 'programsConfirmedTbody',
    searchId: 'searchInputConfirmed',
    categoryFilterId: 'categoryFilterConfirmed',
    statusFilterId: 'statusFilterConfirmed',
    coordinatorFilterId: 'coordinatorFilterConfirmed',
    emptyStateId: 'programsConfirmedEmptyState',
    filters: confirmedFilters,
    groupValue: 'Y',
    renderRows: renderProgramsConfirmedRows
  });
}

function programsForGroupValue(groupValue){
  // The "groups needed" tab has been removed — every non-withdrawn program
  // now shows in the confirmed view regardless of its groupConfirmed value,
  // so nothing can silently disappear if that field is ever 'N'.
  return state.programs.filter(p=>!p.withdrawn);
}

function getWithdrawnPrograms(){
  return state.programs.filter(p=>p.withdrawn)
    .slice()
    .sort((a,b)=>(b.withdrawnAt||0) - (a.withdrawnAt||0));
}

function withdrawProgram(id){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const label = p.programName || p.submitter || 'this entry';
  const inSequence = state.sequence.some(s=>s.programId===id);
  const confirmMsg = inSequence
    ? `Move "${label}" to Deleted programs? It will also be removed from the sequence builder / running order, and everything after it will shift up one slot. You can restore the program later, but you'll need to re-add it to the sequence yourself.`
    : `Move "${label}" to Deleted programs? You can restore it later from that tab.`;
  if(!confirm(confirmMsg)) return;
  p.withdrawn = true;
  p.withdrawnAt = Date.now();
  saveProgramsRemote(state.programs);
  if(inSequence){
    state.sequence = state.sequence.filter(s=>s.programId!==id);
    saveSequenceRemote();
  }
  updateCounts();
  renderBothProgramsTabsIfVisible();
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab === 'deleted') renderDeletedTab();
  if(activeTab === 'sequence') renderSequenceTab();
  if(activeTab === 'final') renderFinalTab();
  showToast(inSequence ? `Moved "${label}" to Deleted programs and removed it from the running order` : `Moved "${label}" to Deleted programs`);
}

function restoreProgram(id){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  p.withdrawn = false;
  p.withdrawnAt = null;
  saveProgramsRemote(state.programs);
  updateCounts();
  renderDeletedTab();
  showToast(`Restored "${p.programName || p.submitter}"`);
}

function deleteProgramForever(id){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const label = p.programName || p.submitter || 'this entry';
  if(!confirm(`Permanently delete "${label}"? This cannot be undone — it will be removed completely, including its participant list. There is no way to get it back.`)) return;

  state.programs = state.programs.filter(pr=>pr.id!==id);
  saveProgramsRemote(state.programs);

  // Clean up any leftover participant roster or sequence placement for
  // this program, in case stale data exists from before it was withdrawn.
  if(state.participants[id]){
    delete state.participants[id];
    saveParticipantsRemote();
  }
  if(state.sequence.some(s=>s.programId===id)){
    state.sequence = state.sequence.filter(s=>s.programId!==id);
    saveSequenceRemote();
  }

  updateCounts();
  renderDeletedTab();
  showToast(`Permanently deleted "${label}"`);
}

function formatWithdrawnDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

function renderDeletedTab(){
  const root = document.getElementById('tab-deleted');
  const withdrawn = getWithdrawnPrograms();

  if(withdrawn.length === 0){
    root.innerHTML = `
      <div class="empty-state">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2m2 0l-1 13a2 2 0 0 1 -2 2H8a2 2 0 0 1 -2 -2L5 7"/><path d="M10 11v6M14 11v6"/></svg>
        <p>No withdrawn programs. Use the trash icon on a program row in the Programs tab to move it here.</p>
      </div>
    `;
    return;
  }

function renderProgramRowsInto(tbodyId, emptyStateId, filters, groupValue){
  const tbody = document.getElementById(tbodyId);
  if(!tbody) return;
  const q = filters.search.toLowerCase();
  const scoped = programsForGroupValue(groupValue);
  const filtered = scoped.filter(p=>{
    if(filters.category && p.category !== filters.category) return false;
    if(filters.status === 'participants-y' && p.participantsReceived !== 'Y') return false;
    if(filters.status === 'participants-n' && p.participantsReceived !== 'N') return false;
    if(filters.status === 'av-y' && p.avReceived !== 'Y') return false;
    if(filters.status === 'av-n' && p.avReceived !== 'N') return false;
    if(filters.status === 'pending-name' && !p.isPending) return false;
    if(filters.coordinator === '__unassigned__' && p.coordinator) return false;
    if(filters.coordinator && filters.coordinator !== '__unassigned__' && p.coordinator !== filters.coordinator) return false;
    if(q && groupValue !== 'N' && !(p.programName.toLowerCase().includes(q) || p.submitter.toLowerCase().includes(q))) return false;
    if(q && groupValue === 'N' && !p.submitter.toLowerCase().includes(q)) return false;
    return true;
  });

  const emptyEl = document.getElementById(emptyStateId);
  if(emptyEl) emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';

  tbody.innerHTML = filtered.map(p=>{
    const catClass = 'cat-' + p.category.replace(/\s+/g,'-');
    const nameClass = p.isPending ? 'pname pending' : 'pname';
    return `
      <tr data-id="${p.id}">
        <td data-label="Program">
          <span class="pfield pname-field ${nameClass} ${p.programName ? '' : 'pfield-empty'}" data-id="${p.id}" tabindex="0">${p.programName ? escapeHtml(p.programName) : 'Add program name'}</span>
        </td>
        <td data-label="Run time">
          <span class="pfield runtime-field ${p.runTimeSeconds==null ? 'pfield-empty' : ''}" data-id="${p.id}" tabindex="0">${p.runTimeSeconds!=null ? escapeHtml(formatRunTime(p.runTimeSeconds)) : 'Add mm:ss'}</span>
        </td>
        <td data-label="Category">
          <select class="category-select cat-select-${catClass.replace('cat-','')}" data-field="category" data-id="${p.id}">
            ${CATEGORIES.map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </td>
        <td data-label="Program lead">
          <span class="pfield submitter-field ${p.submitter && p.submitter!=='—' ? '' : 'pfield-empty'}" data-id="${p.id}" tabindex="0">${p.submitter && p.submitter!=='—' ? escapeHtml(p.submitter) : 'Add lead name'}</span>
        </td>
        <td data-label="Coordinator">
          <select class="coord-select" data-field="coordinator" data-id="${p.id}">
            <option value="">— assign —</option>
            ${COORDINATORS.map(c=>`<option value="${c}" ${p.coordinator===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </td>
        <td data-label="Participants received">
          <div class="yn-toggle">
            <button class="yes ${p.participantsReceived==='Y'?'active':''}" data-field="participantsReceived" data-value="Y" data-id="${p.id}">Y</button>
            <button class="no ${p.participantsReceived==='N'?'active':''}" data-field="participantsReceived" data-value="N" data-id="${p.id}">N</button>
          </div>
        </td>
        <td data-label="AV received">
          <div class="yn-toggle">
            <button class="yes ${p.avReceived==='Y'?'active':''}" data-field="avReceived" data-value="Y" data-id="${p.id}">Y</button>
            <button class="no ${p.avReceived==='N'?'active':''}" data-field="avReceived" data-value="N" data-id="${p.id}">N</button>
          </div>
        </td>
        <td data-label="Withdraw" style="text-align:right;">
          <button class="withdraw-btn" data-id="${p.id}" aria-label="Withdraw program" title="Move to Deleted programs"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2m2 0l-1 13a2 2 0 0 1 -2 2H8a2 2 0 0 1 -2 -2L5 7"/><path d="M10 11v6M14 11v6"/></svg></button>
        </td>
      </tr>
    `;
  }).join('');

  tbody.querySelectorAll('select.coord-select').forEach(el=>{
    el.addEventListener('change', onFieldChange);
  });
  tbody.querySelectorAll('select.category-select').forEach(el=>{
    el.addEventListener('change', e=>{
      onFieldChange(e);
      renderBothProgramsTabsIfVisible();
    });
  });
  tbody.querySelectorAll('.yn-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const field = btn.dataset.field;
      const val = btn.dataset.value;
      updateProgram(id, field, val);
      renderBothProgramsTabsIfVisible();
    });
  });
  tbody.querySelectorAll('.withdraw-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> withdrawProgram(btn.dataset.id));
  });
  tbody.querySelectorAll('.runtime-field').forEach(span=>{
    span.addEventListener('click', ()=> activateRunTimeEdit(span));
    span.addEventListener('keydown', e=>{
      if(e.key === 'Enter') activateRunTimeEdit(span);
    });
  });
  tbody.querySelectorAll('.pname-field').forEach(span=>{
    span.addEventListener('click', ()=> activateProgramNameEdit(span));
    span.addEventListener('keydown', e=>{
      if(e.key === 'Enter') activateProgramNameEdit(span);
    });
  });
  tbody.querySelectorAll('.submitter-field').forEach(span=>{
    span.addEventListener('click', ()=> activateSubmitterEdit(span));
    span.addEventListener('keydown', e=>{
      if(e.key === 'Enter') activateSubmitterEdit(span);
    });
  });
}

function activateSubmitterEdit(span){
  if(span.querySelector('input')) return;
  const id = span.dataset.id;
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const currentValue = (p.submitter && p.submitter!=='—') ? p.submitter : '';

  span.classList.remove('pfield-empty');
  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = 'Lead name';
  input.className = 'pfield-input';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    p.submitter = raw || '—';
    saveProgramsDebounced();
    renderBothProgramsTabsIfVisible();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderBothProgramsTabsIfVisible();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

function activateProgramNameEdit(span){
  if(span.querySelector('input')) return; // already editing
  const id = span.dataset.id;
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const currentValue = p.programName || '';

  span.classList.remove('pfield-empty');
  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = 'Program name';
  input.className = 'pfield-input';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      showToast('Program name can\'t be blank');
      renderBothProgramsTabsIfVisible();
      return;
    }
    p.programName = raw;
    p.isPending = false;
    saveProgramsDebounced();
    renderBothProgramsTabsIfVisible();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderBothProgramsTabsIfVisible();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

function activateRunTimeEdit(span){
  if(span.querySelector('input')) return; // already editing
  const id = span.dataset.id;
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  const currentValue = p.runTimeSeconds!=null ? formatRunTime(p.runTimeSeconds) : '';

  span.classList.remove('pfield-empty');
  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = 'mm:ss';
  input.className = 'pfield-input';
  input.style.maxWidth = '70px';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    const raw = input.value.trim();
    if(!raw){
      p.runTimeSeconds = null;
    } else {
      const parsed = parseRunTime(raw);
      if(parsed == null){
        showToast('Enter run time as mm:ss, e.g. 6:30');
        renderBothProgramsTabsIfVisible();
        return;
      }
      p.runTimeSeconds = parsed;
    }
    saveProgramsDebounced();
    renderBothProgramsTabsIfVisible();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderBothProgramsTabsIfVisible();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

function renderBothProgramsTabsIfVisible(){
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab === 'programs-confirmed') renderProgramsConfirmedTab();
  updateCounts();
}

function onFieldChange(e){
  const id = e.target.dataset.id;
  const field = e.target.dataset.field;
  const value = e.target.value;
  updateProgram(id, field, value);
}

function updateProgram(id, field, value){
  const p = state.programs.find(p=>p.id===id);
  if(!p) return;
  p[field] = value;
  saveProgramsDebounced();
}

function truncate(s, n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Parses "6:30" -> 390 seconds. Accepts bare numbers ("6" -> 360s) too.
// Returns null for empty/unparseable input.
function parseRunTime(str){
  if(str == null) return null;
  const s = String(str).trim();
  if(!s) return null;
  const mmss = s.match(/^(\d+):([0-5]?\d)$/);
  if(mmss) return (parseInt(mmss[1],10) * 60) + parseInt(mmss[2],10);
  const minsOnly = s.match(/^\d+$/);
  if(minsOnly) return parseInt(s,10) * 60;
  return null;
}

function formatRunTime(totalSeconds){
  if(totalSeconds == null) return '';
  const m = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function getProgramRunTimeSeconds(p){
  return (p.runTimeSeconds != null) ? p.runTimeSeconds : DEFAULT_RUN_TIME_SECONDS;
}

function formatClockTime(date){
  return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

// Walks the sequence in order starting from SHOW_START_TIME, returning
// { startTime, endTime, durationSeconds, isDefaultDuration } per item,
// with a 1.5-minute buffer inserted between every item (including before the first).
// Both regular programs and admin items are real records in state.programs,
// so duration always comes from the same single source: p.runTimeSeconds.
function computeRunSheetTimes(){
  const base = new Date();
  base.setHours(SHOW_START_TIME.hour, SHOW_START_TIME.minute, 0, 0);
  let cursor = new Date(base);

  return state.sequence.map(item=>{
    const p = state.programs.find(pr=>pr.id===item.programId);
    const durationSeconds = p ? getProgramRunTimeSeconds(p) : DEFAULT_RUN_TIME_SECONDS;
    const isDefaultDuration = !(p && p.runTimeSeconds != null);
    const startTime = new Date(cursor);
    const endTime = new Date(startTime.getTime() + durationSeconds*1000);
    cursor = new Date(endTime.getTime() + BUFFER_SECONDS*1000);
    return { itemId: item.id, startTime, endTime, durationSeconds, isDefaultDuration };
  });
}

// ===================== COUNTDOWN BANNER =====================
function getDaysToEvent(){
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfEvent = new Date(EVENT_DATE.getFullYear(), EVENT_DATE.getMonth(), EVENT_DATE.getDate());
  return Math.round((startOfEvent - startOfToday) / (1000*60*60*24));
}

function renderCountdownBanner(){
  const el = document.getElementById('countdownBanner');
  if(!el) return;
  const days = getDaysToEvent();

  if(days < 0){
    el.classList.remove('show');
    return;
  }
  el.classList.add('show');
  if(days === 0){
    el.classList.add('cd-today');
    el.innerHTML = `🎉 Kalasandhya is today! Doors open ${formatClockTime((()=>{const d=new Date();d.setHours(SHOW_START_TIME.hour,SHOW_START_TIME.minute,0,0);return d;})())} at ${VENUE_NAME}.`;
  } else {
    el.classList.remove('cd-today');
    el.innerHTML = `<span class="cd-num">${days}</span> day${days===1?'':'s'} to go until Kalasandhya 2026 — ${VENUE_NAME}`;
  }
}

let weatherCache = null;
async function fetchEventWeather(){
  if(weatherCache !== null) return weatherCache;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${VENUE_LAT}&longitude=${VENUE_LON}&current_weather=true&temperature_unit=celsius`;
    const res = await fetch(url);
    const data = await res.json();
    weatherCache = data.current_weather || null;
  }catch(e){
    console.error('weather fetch failed', e);
    weatherCache = null;
  }
  return weatherCache;
}

const WEATHER_CODE_LABELS = {
  0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
  45:'Foggy', 48:'Foggy', 51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
  61:'Light rain', 63:'Rain', 65:'Heavy rain', 71:'Light snow', 73:'Snow', 75:'Heavy snow',
  80:'Rain showers', 81:'Rain showers', 82:'Heavy showers', 95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm'
};

async function renderWeatherVenueBlock(){
  const mount = document.getElementById('weatherVenueMount');
  if(!mount) return;

  mount.innerHTML = `
    <div class="weather-venue-panel">
      <div class="weather-block" id="weatherBlockInner">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:26px;height:26px;color:var(--marigold-dark);"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41 -1.41M17.66 6.34l1.41 -1.41"/></svg>
        <span style="font-size:12.5px;color:var(--ink-soft);">Loading weather for ${VENUE_NAME}…</span>
      </div>
      <div class="weather-venue-divider"></div>
      <a class="venue-link" href="${VENUE_MAPS_URL}" target="_blank" rel="noopener">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7 -6.1 -7 -11a7 7 0 0 1 14 0c0 4.9 -7 11 -7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        ${VENUE_NAME} — get directions
      </a>
    </div>
  `;

  const weather = await fetchEventWeather();
  const inner = document.getElementById('weatherBlockInner');
  if(!inner) return; // tab may have changed by the time this resolves
  if(!weather){
    inner.innerHTML = `<span style="font-size:12.5px;color:var(--ink-soft);">Weather unavailable right now.</span>`;
    return;
  }
  const label = WEATHER_CODE_LABELS[weather.weathercode] || 'Conditions';
  inner.innerHTML = `
    <span class="weather-temp">${Math.round(weather.temperature)}°C</span>
    <span class="weather-desc">${label} today, near ${VENUE_NAME}${days===0 ? ' — event day!' : ` · ${days} day${days===1?'':'s'} out`}</span>
  `;
}

// ===================== SPONSORSHIP MILESTONE CONFETTI =====================
const SPONSOR_MILESTONES = [500, 1000, 2500, 5000, 7500, 10000];
const MILESTONE_STORAGE_KEY = 'kalasandhya_milestone_reached_v1';

function checkSponsorMilestone(){
  const total = getTotalSponsorshipAmount();
  let lastSeen = 0;
  try{ lastSeen = parseInt(localStorage.getItem(MILESTONE_STORAGE_KEY) || '0', 10) || 0; }catch(e){}
  const justReached = SPONSOR_MILESTONES.filter(m => total >= m && m > lastSeen);
  if(justReached.length){
    const newest = justReached[justReached.length-1];
    try{ localStorage.setItem(MILESTONE_STORAGE_KEY, String(newest)); }catch(e){}
    triggerConfetti();
    showToast(`🎉 Sponsorship just passed ${formatCurrency(newest)}!`);
  }
}

function triggerConfetti(){
  let canvas = document.getElementById('confettiCanvas');
  if(!canvas){
    canvas = document.createElement('canvas');
    canvas.id = 'confettiCanvas';
    document.body.appendChild(canvas);
  }
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#E8943A', '#C7972A', '#7A1F2B', '#FBF4E6', '#3F8F4F'];
  const pieces = Array.from({length: 140}, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.3,
    size: 5 + Math.random()*6,
    color: colors[Math.floor(Math.random()*colors.length)],
    speedY: 2 + Math.random()*3,
    speedX: -1.5 + Math.random()*3,
    rotation: Math.random()*360,
    rotationSpeed: -8 + Math.random()*16
  }));
  const start = Date.now();
  const duration = 3200;

  function frame(){
    const elapsed = Date.now() - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p=>{
      p.x += p.speedX;
      p.y += p.speedY;
      p.rotation += p.rotationSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(elapsed < duration){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.remove();
    }
  }
  requestAnimationFrame(frame);
}

// ===================== PRESENTER VIEW TAB =====================
function getPresenterSequenceItems(){
  const times = computeRunSheetTimes();
  return state.sequence.map((item, idx)=>{
    const p = state.programs.find(pr=>pr.id===item.programId);
    const t = times[idx];
    return { idx, item, p, t };
  }).filter(row=>row.p);
}

function setLiveIndex(newIndex){
  const rows = getPresenterSequenceItems();
  const clamped = Math.max(-1, Math.min(newIndex, rows.length - 1));
  state.live = { ...state.live, currentIndex: clamped };
  saveLiveRemote();
  renderPresenterTab();
}

function recordActualTime(idx, value){
  if(!state.live.actuals) state.live.actuals = {};
  if(value){
    state.live.actuals[idx] = value;
  } else {
    delete state.live.actuals[idx];
  }
  saveLiveRemote();
  // re-render just the diff spans without full re-render to avoid losing focus
  updateRetroDiffs();
}

function renderPresenterTab(){
  const root = document.getElementById('tab-presenter');

  const rows = getPresenterSequenceItems();
  if(rows.length===0){
    root.innerHTML = `
      <div class="empty-state">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <p>No running order yet. Build one in the Sequence builder tab.</p>
      </div>
    `;
    return;
  }

  const currentIndex = (state.live && typeof state.live.currentIndex === 'number') ? state.live.currentIndex : -1;
  const actuals = (state.live && state.live.actuals) ? state.live.actuals : {};
  const current = rows.find(r=>r.idx===currentIndex);
  const nextRow = rows.find(r=>r.idx===currentIndex+1);
  const isBeforeStart = currentIndex < 0;
  const isFinished = rows.length>0 && currentIndex >= rows[rows.length-1].idx;

  // Run list with planned vs actual
  const runListRows = rows.map(row=>{
    const { idx, p, t } = row;
    const isCurrent = idx === currentIndex;
    const isDone = idx < currentIndex;
    const actual = actuals[idx] || '';
    const plannedEnd = t ? formatClockTime(t.endTime) : '—';
    let diff = '';
    if(actual && t){
      const [ah, am] = actual.split(':').map(Number);
      const planMins = t.endTime.getHours()*60 + t.endTime.getMinutes();
      const actMins = ah*60 + am;
      const delta = actMins - planMins;
      if(delta !== 0) diff = `<span class="retro-diff ${delta>0?'late':'early'}" data-diff="${idx}">${delta>0?'+':''}${delta}m</span>`;
    }
    return `
      <tr class="retro-row ${isCurrent?'retro-current':''} ${isDone?'retro-done':''}">
        <td class="retro-num">${idx+1}</td>
        <td class="retro-name">${escapeHtml(p.programName)}</td>
        <td class="retro-planned">${plannedEnd}</td>
        <td class="retro-actual">
          <input type="time" class="retro-time-input" data-idx="${idx}" value="${actual}" placeholder="--:--">
          ${diff}
        </td>
      </tr>
    `;
  }).join('');

  root.innerHTML = `
    <div class="final-header">
      <div class="label">Kalasandhya 2026</div>
      <h2>Presenter view</h2>
    </div>

    <div class="presenter-stage">
      <div class="presenter-now-card">
        <div class="presenter-label">${isBeforeStart ? 'Up first' : isFinished ? 'Show complete' : 'Now showing'}</div>
        ${current ? `
          <div class="presenter-title">${escapeHtml(current.p.programName)}</div>
          ${!isEffectivelyAdminItem(current.p) ? `<div class="presenter-sub">${escapeHtml(current.p.category)}${current.p.coordinator ? ' · '+escapeHtml(current.p.coordinator) : ''}</div>` : `<div class="presenter-sub">Admin item</div>`}
          <div class="presenter-time">${current.t ? formatClockTime(current.t.startTime)+' – '+formatClockTime(current.t.endTime) : ''}</div>
        ` : isBeforeStart ? `
          <div class="presenter-title">${escapeHtml(rows[0].p.programName)}</div>
          <div class="presenter-sub">${rows[0].t ? 'Starts '+formatClockTime(rows[0].t.startTime) : ''}</div>
        ` : `<div class="presenter-empty">That's a wrap!</div>`}
      </div>
      ${nextRow ? `
        <div class="presenter-up-next">
          <span class="presenter-label">Up next</span>
          <span class="presenter-next-name">${escapeHtml(nextRow.p.programName)}</span>
          <span class="presenter-next-time">${nextRow.t ? formatClockTime(nextRow.t.startTime) : ''}</span>
        </div>
      ` : ''}
    </div>

    <div class="presenter-controls">
      <button class="btn-secondary" id="presenterBackBtn" ${currentIndex<0 ? 'disabled' : ''}>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg> Back
      </button>
      <button class="btn-primary" id="presenterNextBtn" ${isFinished ? 'disabled' : ''}>
        ${isBeforeStart ? 'Start show' : 'Mark done & next'} <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>
      </button>
    </div>

    <div class="panel" style="margin-top:18px;">
      <h3>Run sheet — Planned vs Actual</h3>
      <p class="panel-hint">Tap "Record now" when a program finishes to log the actual time for a post-event retro.</p>
      <div style="overflow-x:auto;">
        <table class="retro-table">
          <thead>
            <tr>
              <th style="width:5%;">#</th>
              <th style="width:40%;">Program</th>
              <th style="width:18%;">Planned end</th>
              <th style="width:37%;">Actual finish</th>
            </tr>
          </thead>
          <tbody>${runListRows}</tbody>
        </table>
      </div>
    </div>
    <div class="presenter-hint">Live sync on — all devices stay in step. Actual times are also synced.</div>
  `;

  document.getElementById('presenterBackBtn').addEventListener('click', ()=>setLiveIndex(currentIndex-1));
  document.getElementById('presenterNextBtn').addEventListener('click', ()=>setLiveIndex(currentIndex+1));
  root.querySelectorAll('.retro-time-input').forEach(input=>{
    input.addEventListener('change', ()=>recordActualTime(parseInt(input.dataset.idx), input.value));
  });
}

function updateRetroDiffs(){
  // Update diff badges without re-rendering the whole tab (preserves input focus)
  const rows = getPresenterSequenceItems();
  const actuals = (state.live && state.live.actuals) ? state.live.actuals : {};
  const times = computeRunSheetTimes();
  rows.forEach(({idx, t})=>{
    const actual = actuals[idx] || '';
    const cell = document.querySelector(`.retro-time-input[data-idx="${idx}"]`)?.closest('td');
    if(!cell) return;
    let diffEl = cell.querySelector('.retro-diff');
    if(actual && t){
      const [ah, am] = actual.split(':').map(Number);
      const planMins = t.endTime.getHours()*60 + t.endTime.getMinutes();
      const actMins = ah*60 + am;
      const delta = actMins - planMins;
      if(delta !== 0){
        if(!diffEl){ diffEl = document.createElement('span'); cell.appendChild(diffEl); }
        diffEl.className = `retro-diff ${delta>0?'late':'early'}`;
        diffEl.textContent = (delta>0?'+':'')+delta+'m';
      } else {
        if(diffEl) diffEl.remove();
      }
    } else {
      if(diffEl) diffEl.remove();
    }
  });
}


function isEffectivelyAdminItem(p){
  return p.isAdminItem && p.category === 'Admin item';

function renderContactsRows(){

function exportContactsCsv(){
  const contacts = [...getDedupedContacts()].sort((a,b)=> contactsSort === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));

  const csv = rows.map(r=>r.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n');

  a.href = url;
  a.download = 'kalasandhya-contacts-' + new Date().toISOString().slice(0,10) + '.csv';

  URL.revokeObjectURL(url);
  showToast('Contacts exported');
}
