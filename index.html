      saveProgramsDebounced();
      document.getElementById('originalNoteBox').remove();
    });
  }

  document.getElementById('addParticipantBtn').addEventListener('click', addParticipant);
  document.getElementById('participantMemberInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') addParticipant();
  });
  document.getElementById('participantNameInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('participantMemberInput').focus();
  });

  renderParticipantList();
}

function addParticipant(){
  const nameInput = document.getElementById('participantNameInput');
  const memberInput = document.getElementById('participantMemberInput');
  const name = nameInput.value.trim();
  const memberNumber = memberInput.value.trim();
  if(!name && !memberNumber){ showToast('Enter a name or membership number'); return; }
  if(!state.participants[selectedParticipantProgramId]){
    state.participants[selectedParticipantProgramId] = [];
  }
  state.participants[selectedParticipantProgramId].push({
    id: 'participant_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name,
    memberNumber
  });
  saveParticipantsRemote();
  nameInput.value = '';
  memberInput.value = '';
  nameInput.focus();
  updateCounts();
  renderParticipantPanel();
}

function removeParticipant(programId, id){
  if(!state.participants[programId]) return;
  state.participants[programId] = state.participants[programId].filter(p=>p.id !== id);
  saveParticipantsRemote();
  updateCounts();
  renderParticipantPanel();
}

function updateParticipantField(programId, id, field, value){
  const list = state.participants[programId];
  if(!list) return;
  const p = list.find(p=>p.id===id);
  if(!p) return;
  p[field] = value.trim();
  saveParticipantsRemote();
}

function renderParticipantList(){
  const wrap = document.getElementById('participantListWrap');
  if(!wrap) return;
  const list = state.participants[selectedParticipantProgramId] || [];

  if(list.length === 0){
    wrap.innerHTML = `<div class="participant-empty-row">No participants added yet.</div>`;
    return;
  }

  wrap.innerHTML = list.map((p, idx)=>`
    <div class="participant-row">
      <span class="pnum">${idx+1}</span>
      <div class="pinfo pinfo-grid">
        <span class="pfield pfield-name ${p.name ? '' : 'pfield-empty'}" data-id="${p.id}" data-field="name" tabindex="0">${p.name ? escapeHtml(p.name) : 'Add name'}</span>
        <span class="pfield pfield-member ${p.memberNumber ? '' : 'pfield-empty'}" data-id="${p.id}" data-field="memberNumber" tabindex="0">${p.memberNumber ? escapeHtml(p.memberNumber) : 'Add membership #'}</span>
      </div>
      <button class="rm-btn" data-id="${p.id}" aria-label="Remove"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  `).join('');

  wrap.querySelectorAll('.rm-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> removeParticipant(selectedParticipantProgramId, btn.dataset.id));
  });

  wrap.querySelectorAll('.pfield').forEach(span=>{
    span.addEventListener('click', ()=> activateParticipantFieldEdit(span));
    span.addEventListener('keydown', e=>{
      if(e.key === 'Enter') activateParticipantFieldEdit(span);
    });
  });
}

function activateParticipantFieldEdit(span){
  if(span.querySelector('input')) return; // already editing
  const id = span.dataset.id;
  const field = span.dataset.field;
  const list = state.participants[selectedParticipantProgramId] || [];
  const participant = list.find(p=>p.id===id);
  if(!participant) return;
  const currentValue = participant[field] || '';
  const placeholder = field === 'name' ? 'Participant name' : 'Membership number';

  span.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = placeholder;
  input.className = 'pfield-input';
  span.appendChild(input);
  input.focus();
  input.select();

  let committed = false;
  function commit(){
    if(committed) return;
    committed = true;
    updateParticipantField(selectedParticipantProgramId, id, field, input.value);
    renderParticipantList();
  }
  function cancel(){
    if(committed) return;
    committed = true;
    renderParticipantList();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
}

let waDeadline = '15 July';

function buildWhatsAppMessage(p, deadline){
  const pending = [];
  if(p.participantsReceived !== 'Y') pending.push('participant names');
  if(p.avReceived !== 'Y') pending.push('audio/video tracks');
  if(pending.length === 0) return null;
  const what = pending.length === 2
    ? 'participant names and audio/video tracks'
    : pending[0];
  return `Hi ${escapeHtml(p.submitter)},\n\nWe are still waiting on your *${what}* for *${p.programName}* at Kalasandhya 2026.\n\nPlease ensure this is submitted by *${deadline}* so we can finalise the running order and ensure everything is seamless on the day.\n\nThank you for being a part of Kalasandhya — we can't wait to celebrate Onam together! 🌸\n\nWarm regards,\nWMCG Committee`;
}

      navigator.clipboard.writeText(plain).then(()=>{
        btn.classList.add('copied');
        btn.textContent = '✓ Copied!';
        setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9L3 21"/></svg> Copy message`; }, 2000);

// Pulls a numeric dollar value out of a free-text amount field like "$500",
// "500.50", or "1,200". Returns 0 for blank/unparseable entries so one messy
// entry (e.g. "tbc") doesn't break the running total — it's just skipped.
function parseSponsorAmount(str){
  if(!str) return 0;
  const cleaned = String(str).replace(/[^0-9.]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function getTotalSponsorshipAmount(){
  return state.sponsors.reduce((sum, s)=> sum + parseSponsorAmount(s.amount), 0);
}

function formatCurrency(n){
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function renderPoolList(){
  const poolList = document.getElementById('poolList');
  if(!poolList) return;
  const inSeqIds = new Set(state.sequence.map(s=>s.programId));
  const available = state.programs.filter(p=>!p.withdrawn && !inSeqIds.has(p.id));

  if(available.length === 0){
    poolList.innerHTML = `<div class="empty-note">All confirmed programs have been added to the running order.</div>`;
    return;
  }

  poolList.innerHTML = available.map(p=>`
    <div class="pool-item" draggable="true" data-id="${p.id}">
      <div class="info">
        <div class="t">${escapeHtml(p.programName)}</div>
        <div class="s">${escapeHtml(p.category)} · ${escapeHtml(p.submitter)}</div>
      </div>
      <button class="add-btn" data-id="${p.id}" aria-label="Add to running order"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  `).join('');

  poolList.querySelectorAll('.add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      addProgramToSequence(btn.dataset.id);
    });
  });

  poolList.querySelectorAll('.pool-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{
      seqDragId = item.dataset.id;
      seqDragType = 'pool';
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', ()=>item.classList.remove('dragging'));
  });
}

function addProgramToSequence(programId){
  const exists = state.sequence.some(s=>s.programId===programId);
  if(exists) return;
  const p = state.programs.find(p=>p.id===programId);
  const itemType = (p && isEffectivelyAdminItem(p)) ? 'admin' : 'program';
  state.sequence.push({ id: 'seq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), type: itemType, programId });
  saveSequenceRemote();
  renderSequenceTab();
}

function renderSeqList(){
  const seqList = document.getElementById('seqList');
  if(!seqList) return;

  if(state.sequence.length === 0){
    seqList.innerHTML = `<div class="empty-note">Drag programs here, or click + on items in the pool.</div>`;
  } else {
    seqList.innerHTML = state.sequence.map((item, idx)=>{
      const p = state.programs.find(p=>p.id===item.programId);
      if(!p) return '';
      const effType = (item.type === 'admin' && !isEffectivelyAdminItem(p)) ? 'program' : item.type;
      const subtitle = effType === 'admin'
        ? 'Admin item'
        : `${escapeHtml(p.category)} · ${p.coordinator ? 'Coord: '+escapeHtml(p.coordinator) : 'No coordinator yet'}`;
      return `
        <div class="seq-item${effType === 'admin' ? ' admin-slot' : ''}" draggable="true" data-id="${item.id}">
          <span class="num">${idx+1}</span>
          <span class="grip"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg></span>
          <div class="info">
            <div class="t">${escapeHtml(p.programName)}</div>
            <div class="s">${subtitle}</div>
          </div>
          <button class="rm-btn" data-id="${item.id}" aria-label="Remove"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      `;
    }).join('');
  }

  seqList.querySelectorAll('.rm-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const seqItem = state.sequence.find(s=>s.id===btn.dataset.id);
      if(seqItem && seqItem.type === 'admin'){
        withdrawProgram(seqItem.programId);
        return;
      }
      state.sequence = state.sequence.filter(s=>s.id !== btn.dataset.id);
      saveSequenceRemote();
      renderSequenceTab();
    });
  });

  seqList.querySelectorAll('.seq-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{
      seqDragId = item.dataset.id;
      seqDragType = 'seq';
    });
    item.addEventListener('dragover', e=>{
      e.preventDefault();
      item.classList.add('dragover');
    });
    item.addEventListener('dragleave', ()=>item.classList.remove('dragover'));
    item.addEventListener('drop', e=>{
      e.preventDefault();
      item.classList.remove('dragover');
      const targetId = item.dataset.id;
      handleDropOnSeq(targetId);
    });
  });

  seqList.addEventListener('dragover', e=>e.preventDefault());
  seqList.addEventListener('drop', e=>{
    e.preventDefault();
    if(e.target === seqList){
      handleDropOnSeq(null);
    }
  });
}

function handleDropOnSeq(targetId){
  if(seqDragType === 'pool'){
    const exists = state.sequence.some(s=>s.programId===seqDragId);
    if(exists){ seqDragId=null; seqDragType=null; return; }
    const draggedProgram = state.programs.find(p=>p.id===seqDragId);
    const itemType = (draggedProgram && isEffectivelyAdminItem(draggedProgram)) ? 'admin' : 'program';
    const newItem = { id: 'seq_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), type: itemType, programId: seqDragId };
    if(targetId){
      const idx = state.sequence.findIndex(s=>s.id===targetId);
      state.sequence.splice(idx, 0, newItem);
    } else {
      state.sequence.push(newItem);
    }
  } else if(seqDragType === 'seq'){
    if(targetId === seqDragId){ seqDragId=null; seqDragType=null; return; }
    const fromIdx = state.sequence.findIndex(s=>s.id===seqDragId);
    if(fromIdx === -1){ seqDragId=null; seqDragType=null; return; }
    const [moved] = state.sequence.splice(fromIdx, 1);
    if(targetId){
      const toIdx = state.sequence.findIndex(s=>s.id===targetId);
      state.sequence.splice(toIdx, 0, moved);
    } else {
      state.sequence.push(moved);
    }
  }
  seqDragId = null;
  seqDragType = null;
  saveSequenceRemote();
  renderSequenceTab();
}

// ===================== FINAL TAB =====================
function renderFinalTab(){
  const root = document.getElementById('tab-final');
  updateCounts();

  if(state.sequence.length === 0){
    root.innerHTML = `
      <div class="empty-state">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 17.5l1.5 1.5l2.5 -2.5"/><path d="M11 6h9M11 12h9M11 18h9"/></svg>
        <p>No running order yet. Build one in the Sequence builder tab.</p>
      </div>
    `;
    return;
  }

  const times = computeRunSheetTimes();
  const showEndTime = times.length ? times[times.length-1].endTime : null;
  const showStartTime = (()=>{ const d = new Date(); d.setHours(SHOW_START_TIME.hour, SHOW_START_TIME.minute, 0, 0); return d; })();
  const anyDefaulted = times.some(t=>t.isDefaultDuration);

  const rows = state.sequence.map((item, idx) => {
    const t = times[idx];
    const timingHtml = t
      ? `<div class="ftiming${t.isDefaultDuration ? ' ftiming-default' : ''}">${formatClockTime(t.startTime)} – ${formatClockTime(t.endTime)}${t.isDefaultDuration ? '<span class="ftiming-est">est.</span>' : ''}</div>`
      : `<div class="ftiming">—</div>`;

    const p = state.programs.find(p=>p.id===item.programId);
    if(!p) return '';
    const rowEffType = (item.type === 'admin' && !isEffectivelyAdminItem(p)) ? 'program' : item.type;
    if(rowEffType === 'admin'){
      return `
        <div class="final-row admin">
          <div class="fnum">${idx+1}</div>
          <div class="finfo">
            <div class="ft">${escapeHtml(p.programName)}</div>
            <div class="fs">Admin item</div>
          </div>
          ${timingHtml}
          <div class="fstatus"><span class="badge-admin">Admin</span></div>
        </div>
      `;
    }
    const fullyReady = p.participantsReceived==='Y' && p.avReceived==='Y';
    const statusBadge = p.isPending
      ? `<span class="badge-pending">Name pending</span>`
      : (fullyReady ? `<span class="badge-ready">Ready</span>` : `<span class="badge-pending">${p.participantsReceived!=='Y' ? 'Participants pending' : 'AV pending'}</span>`);
    return `
      <div class="final-row">
        <div class="fnum">${idx+1}</div>
        <div class="finfo">
          <div class="ft">${escapeHtml(p.programName)}</div>
          <div class="fs">${escapeHtml(p.category)} · ${escapeHtml(p.submitter)}</div>
        </div>
        ${timingHtml}
        <div class="fstatus">${statusBadge}</div>
      </div>
    `;
  }).join('');

  root.innerHTML = `
    <div class="final-header">
      <div class="label">Kalasandhya 2026</div>
      <h2>Final running order</h2>
    </div>
    <div style="background:#FBF1E3;border:1px solid #E8C9A0;border-radius:9px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--marigold-dark);display:flex;align-items:center;gap:8px;">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 9h.01M11 12h1v4h1"/></svg>
      Show starts at ${formatClockTime(showStartTime)}, with a 1.5 min buffer between every item.${anyDefaulted ? ' Items marked "est." are using a default run time — enter the real time in Tab 1 / via admin presets for an accurate run sheet.' : ''}${showEndTime ? ` Estimated finish: ${formatClockTime(showEndTime)}.` : ''}
    </div>
    <div class="actions-bar">
      <button class="btn-secondary" id="exportBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2M7 11l5 5l5 -5M12 4v12"/></svg> Export data</button>
      <button class="btn-secondary" id="importBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2M7 9l5 -5l5 5M12 4v12"/></svg> Import data</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn-secondary" id="exportExcelBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M10 13l-1 2l1 2M14 13l1 2l-1 2M11.5 17l1 -4"/></svg> Export Excel</button>
      <button class="btn-secondary" id="printBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 17h2a2 2 0 0 0 2 -2v-4a2 2 0 0 0 -2 -2h-14a2 2 0 0 0 -2 2v4a2 2 0 0 0 2 2h2"/><path d="M17 9v-4a2 2 0 0 0 -2 -2h-6a2 2 0 0 0 -2 2v4"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg> Print</button>
    </div>
    <div class="panel">
      <div class="final-list">${rows}</div>
    </div>
  `;

  document.getElementById('printBtn').addEventListener('click', printRunningOrder);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('exportExcelBtn').addEventListener('click', exportRunningOrderExcel);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
}

function exportRunningOrderExcel(){
  const times = computeRunSheetTimes();
  const showStartTime = (()=>{ const d=new Date(); d.setHours(SHOW_START_TIME.hour,SHOW_START_TIME.minute,0,0); return d; })();

  // Build CSV rows (Excel opens CSV natively, no library needed)
  const escape = v => `"${String(v||'').replace(/"/g,'""')}"`;

  const headers = ['#','Program','Category','Type','Start','End','Duration (min)','Participants','Choreographer / Lead','Coordinator'];
  const rows = [headers];

  state.sequence.forEach((item, idx)=>{
    const p = state.programs.find(pr=>pr.id===item.programId);
    if(!p) return;
    const t = times[idx];
    const startStr = t ? formatClockTime(t.startTime) : '';
    const endStr   = t ? formatClockTime(t.endTime) : '';
    const durMins  = t ? Math.round(t.durationSeconds/60) : '';
    const participants = (state.participants[p.id]||[]).map(pt=>pt.name).join(', ');
    const type = (item.type === 'admin' && p && !isEffectivelyAdminItem(p)) ? 'Program' : item.type === 'admin' ? 'Admin' : 'Program';
    rows.push([
      idx+1,
      p.programName,
      p.category||'',
      type,
      startStr,
      endStr,
      durMins,
      participants,
      p.submitter||'',
      p.coordinator||''
    ].map(escape));
  });

  // Add summary rows at bottom
  rows.push([]);
  rows.push([escape('Event'), escape('Kalasandhya 2026 — WMCG Onam Celebrations')]);
  rows.push([escape('Date'), escape('Saturday 8 August 2026')]);
  rows.push([escape('Venue'), escape(VENUE_NAME)]);
  rows.push([escape('Show start'), escape(formatClockTime(showStartTime))]);
  const totalPax = Object.values(state.participants).reduce((s,l)=>s+l.length,0);
  rows.push([escape('Total participants'), escape(totalPax)]);
  rows.push([escape('Exported'), escape(new Date().toLocaleString('en-AU'))]);

  const csv = '\uFEFF' + rows.map(r=>Array.isArray(r)?r.join(','):'').join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Kalasandhya-2026-Running-Order-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportData(){
  const payload = { programs: state.programs, sequence: state.sequence, sponsors: state.sponsors, participants: state.participants, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kalasandhya-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const payload = JSON.parse(evt.target.result);
      if(payload.programs) state.programs = payload.programs;
      if(payload.sequence){
        const seqMigration = migrateSequence(payload.sequence);
        state.sequence = seqMigration.sequence;
      }
      if(payload.sponsors) state.sponsors = payload.sponsors;
      if(payload.participants) state.participants = payload.participants;
      saveProgramsRemote(state.programs);
      saveSequenceRemote();
      saveSponsorsRemote();
      saveParticipantsRemote();
      updateCounts();
      renderFinalTab();
      showToast('Data imported');
    }catch(err){
      showToast('Could not read that file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===================== INIT =====================
async function init(){
  renderPookalamRing();
  initTabs();
  await initFirebase();
  await loadState();
  updateCounts();
  renderDashboardTab();
  renderFirebaseStatusBanner();

  // Cross-tab sync in the same browser, only relevant when running on the
  // localStorage fallback (Firebase's onSnapshot already handles this when configured).
  if(!firebaseReady){
    window.addEventListener('storage', (e)=>{
      if(e.key === STORAGE_KEY_PROGRAMS && e.newValue){
        try{
          state.programs = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='programs-confirmed') renderProgramsConfirmedTab();
          if(activeTab==='contacts') renderContactsRows();
          if(activeTab==='dashboard') renderDashboardTab();
          if(activeTab==='presenter') renderPresenterTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_SEQUENCE && e.newValue){
        try{
          const seqMigration = migrateSequence(JSON.parse(e.newValue));
          state.sequence = seqMigration.sequence;
          if(seqMigration.programsChanged) saveProgramsRemote(state.programs);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='sequence') renderSequenceTab();
          if(activeTab==='final') renderFinalTab();
          if(activeTab==='presenter') renderPresenterTab();
          if(activeTab==='dashboard') renderDashboardTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_SPONSORS && e.newValue){
        try{
          state.sponsors = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='sponsors') renderSponsorsTab();
          if(activeTab==='dashboard') renderDashboardTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_PARTICIPANTS && e.newValue){
        try{
          state.participants = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='participants') renderParticipantsTab();
          if(activeTab==='dashboard') renderDashboardTab();
          updateCounts();
        }catch(err){}
      }
      if(e.key === STORAGE_KEY_LIVE && e.newValue){
        try{
          state.live = JSON.parse(e.newValue);
          const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
          if(activeTab==='presenter') renderPresenterTab();
          if(activeTab==='dashboard') renderDashboardTab();
        }catch(err){}
      }
    });
  }
}

// ===================== PWA: SERVICE WORKER + INSTALL PROMPT =====================
function repositionInstallBanner(){
  const installBanner = document.getElementById('installBanner');
  const fbBanner = document.getElementById('firebaseStatusBanner');
  if(!installBanner) return;
  const fbVisible = fbBanner && getComputedStyle(fbBanner).display !== 'none';
  installBanner.style.bottom = fbVisible ? fbBanner.offsetHeight + 'px' : '0';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(err=>{
      console.error('Service worker registration failed', err);
    });
  });
}

let deferredInstallPrompt = null;
const INSTALL_DISMISSED_KEY = 'kalasandhya_install_dismissed_v1';

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(localStorage.getItem(INSTALL_DISMISSED_KEY) === 'true') return;
  const banner = document.getElementById('installBanner');
  if(banner){
    banner.style.display = 'flex';
    repositionInstallBanner();
  }
});

document.addEventListener('DOMContentLoaded', ()=>{
  const installBtn = document.getElementById('installBtn');
  const dismissBtn = document.getElementById('dismissInstallBtn');
  const banner = document.getElementById('installBanner');

  if(installBtn){
    installBtn.addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if(banner) banner.style.display = 'none';
    });
  }
  if(dismissBtn){
    dismissBtn.addEventListener('click', ()=>{
      if(banner) banner.style.display = 'none';
      try{ localStorage.setItem(INSTALL_DISMISSED_KEY, 'true'); }catch(e){}
    });
  }

  initPosterSection();
});

const POSTER_COLLAPSED_KEY = 'kalasandhya_poster_collapsed_v1';

function initPosterSection(){
  const toggleBtn = document.getElementById('posterToggleBtn');
  const toggleLabel = document.getElementById('posterToggleLabel');
  const chevron = document.getElementById('posterChevron');
  const body = document.getElementById('posterBody');
  const img = document.getElementById('posterImg');
  const fullsizeBtn = document.getElementById('posterFullsizeBtn');
  const lightbox = document.getElementById('posterLightbox');
  const lightboxImg = document.getElementById('posterLightboxImg');
  const lightboxClose = document.getElementById('posterLightboxClose');
  if(!toggleBtn || !body || !img) return;

  img.src = POSTER_IMAGE_DATA_URI;
  lightboxImg.src = POSTER_IMAGE_DATA_URI;

  // Expanded by default on a person's very first visit (no preference saved yet),
  // collapsed thereafter once they've seen it — collapsing it is remembered
  // per device only, since it's a personal UI preference, not shared committee data.
  let collapsed;
  try{ collapsed = localStorage.getItem(POSTER_COLLAPSED_KEY) === 'true'; }
  catch(e){ collapsed = false; }

  function setExpanded(expanded){
    body.classList.toggle('expanded', expanded);
    toggleBtn.classList.toggle('expanded', expanded);
    toggleLabel.textContent = expanded ? 'Hide event poster' : 'View event poster';
    try{ localStorage.setItem(POSTER_COLLAPSED_KEY, expanded ? 'false' : 'true'); }catch(e){}
  }
  setExpanded(!collapsed);

  toggleBtn.addEventListener('click', ()=>{
    const isExpanded = body.classList.contains('expanded');
    setExpanded(!isExpanded);
  });

  function openLightbox(){ lightbox.classList.add('show'); }
  function closeLightbox(){ lightbox.classList.remove('show'); }

  img.addEventListener('click', openLightbox);
  fullsizeBtn.addEventListener('click', openLightbox);
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{
    if(e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeLightbox();
  });
}

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
});

window.addEventListener('resize', ()=> repositionInstallBanner());

init().catch(err=>{
  console.error('Failed to start app', err);
  const root = document.getElementById('tab-programs-confirmed');
  if(root){
    root.innerHTML = `
      <div class="empty-state">
        <p style="color:var(--maroon);font-weight:600;">Something went wrong loading saved data.</p>
        <p style="margin-top:8px;">Try a hard refresh. If that doesn't help, clear this site's local storage from your browser's developer tools, or open the file in a private/incognito window to start fresh.</p>
      </div>
    `;
  }
});
